<script type="text/babel">
const REGIONS = window.REGIONS;
const { useState, useMemo, useEffect, useRef } = React;

/* ===================== DATA ===================== */
const LETTERS = ["A", "B", "C", "D"];
const SUBJECTS = [
  { code: "english", label: "English" },

  { code: "mapeh-whole", label: "MAPEH (whole)", termOnly: true, comps: ["Music", "Arts", "PE", "Health"] },
];
const GRADES = ["Kinder", "Grade 1", "Grade 2", "Grade 3", "Grade 4", "Grade 5", "Grade 6", "Grade 7", "Grade 8", "Grade 9", "Grade 10", "Grade 11", "Grade 12"];
const subjectOf = code => SUBJECTS.find(s => s.code === code) || SUBJECTS[0];
const DEFAULT_PROFILE = { region: "", division: "", school: "", configured: false };
const SLOTS = { ST1: "Summative Test 1", ST2: "Summative Test 2", TE: "Term Examination" };
const termNow = () => { const m = new Date().getMonth() + 1, d = new Date().getDate(); return (m >= 6 && (m < 9 || (m === 9 && d <= 15))) ? "Term 1" : (m >= 9 && m <= 12) ? "Term 2" : "Term 3"; };
const DEFAULT_CONFIG = { examType: "term", slot: "TE", term: termNow(), subject: "mapeh-music-arts", itemCount: 50, tags: null };
/* DO 15, s. 2026 item counts: [Term Exam items, max items per Summative Test] */
function itemRule(grade) {
  const g = parseInt(String(grade).replace(/\D/g, ""), 10);
  if (g >= 4 && g <= 6) return { te: 40, st: 20, ks: "Grades 4–6" };
  if (g >= 7 && g <= 10) return { te: 50, st: 25, ks: "Grades 7–10" };
  if (g >= 11 && g <= 12) return { te: 60, st: 30, ks: "Grades 11–12" };
  return null;
}
/* Learner names never go to Claude: they are kept only in this browser. */
const localStore = {
  get(k, fb) { if (Vault.isOpen()) return Vault.get("jordynai_" + k, fb); try { const v = JSON.parse(localStorage.getItem("jordynai_" + k) || "null"); return v == null ? fb : v; } catch (e) { return fb; } },
  set(k, v) { if (Vault.isOpen()) return Vault.set("jordynai_" + k, v); try { if (v == null) localStorage.removeItem("jordynai_" + k); else localStorage.setItem("jordynai_" + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const COMP_STYLE = ["bg-violet-500", "bg-pink-500", "bg-emerald-500", "bg-sky-500"];
/* Default component blocks: earlier components get the smaller share (12 + 13, or 12 + 13 + 12 + 13 for 50). */
function defaultTags(n, comps) {
  if (!comps) return null;
  const k = comps.length, base = Math.floor(n / k);
  let extra = n - base * k;
  const sizes = comps.map(() => base);
  for (let i = k - 1; i >= 0 && extra > 0; i -= 2) { sizes[i]++; extra--; }
  for (let i = k - 2; i >= 0 && extra > 0; i -= 2) { sizes[i]++; extra--; }
  const tags = []; sizes.forEach((sz, ci) => { for (let j = 0; j < sz; j++) tags.push(ci); });
  return tags;
}
/* "1,3,6-8" -> [1,3,6,7,8] */
function parseItems(text, n) {
  const out = new Set();
  String(text || "").split(/[,\s]+/).filter(Boolean).forEach(part => {
    const m = part.match(/^(\d+)(?:-(\d+))?$/); if (!m) return;
    const a = +m[1], b = m[2] ? +m[2] : a;
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) if (i >= 1 && i <= n) out.add(i);
  });
  return [...out].sort((x, y) => x - y);
}
const listItems = arr => { const out = []; let i = 0; while (i < arr.length) { let j = i; while (j + 1 < arr.length && arr[j + 1] === arr[j] + 1) j++; out.push(j > i ? `${arr[i]}-${arr[j]}` : `${arr[i]}`); i = j + 1; } return out.join(", "); };

/* ===================== HELPERS ===================== */
function toInitials(full) {
  const str = String(full || "").trim();
  if (!str) return "";
  if (/^([A-Za-zÑñ]\.)+$/.test(str.replace(/\s/g, ""))) return str.replace(/\s/g, "").toUpperCase();
  let first = str, last = "";
  if (str.includes(",")) { const [l, ...f] = str.split(","); last = l; first = f.join(" "); }
  const letters = w => w.split(/[\s.-]+/).filter(Boolean).map(x => x[0].toUpperCase());
  return [...letters(first), ...letters(last)].map(c => c + ".").join("");
}
function proficiency(p) {
  if (p >= 96) return { label: "Mastered", color: "bg-emerald-500" };
  if (p >= 86) return { label: "Closely Approximating Mastery", color: "bg-emerald-600" };
  if (p >= 66) return { label: "Moving Towards Mastery", color: "bg-sky-500" };
  if (p >= 35) return { label: "Average Mastery", color: "bg-amber-500" };
  if (p >= 15) return { label: "Low Mastery", color: "bg-orange-500" };
  if (p >= 5) return { label: "Very Low Mastery", color: "bg-red-500" };
  return { label: "Absolutely No Mastery", color: "bg-red-700" };
}
const idNum = id => parseInt(String(id).replace(/\D/g, ""), 10) || 0;
const gender = id => { const c = String(id).trim().toUpperCase()[0]; return c === "B" ? "B" : c === "G" ? "G" : "?"; };
const fmt = n => (Number.isFinite(n) ? n.toFixed(2) : "0.00");
const up = v => String(v || "").toUpperCase();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sdOf = arr => { if (!arr.length) return 0; const m = arr.reduce((t, s) => t + s.score, 0) / arr.length; return Math.sqrt(arr.reduce((t, s) => t + (s.score - m) ** 2, 0) / arr.length); };

/* ===================== SHEET LAYOUT ===================== */
/* Pick the column count that gives the biggest bubbles for this many items. All sizes in mm. */
function sheetLayout(n) {
  const AVAIL_H = 87, WIDTH = 93, GAP = 1.6;
  let best = null;
  for (let cols = 1; cols <= 4; cols++) {
    const rows = Math.ceil(n / cols);
    const rowH = Math.min(13, AVAIL_H / rows);
    const colW = (WIDTH - GAP * (cols - 1)) / cols;
    const b = Math.min(rowH * 0.62, ((colW - 6) / 4) * 0.8, 7);
    if (!best || b > best.b + 0.05 || (Math.abs(b - best.b) <= 0.05 && rowH > best.rowH)) best = { cols, rows, rowH, colW, b };
  }
  best.gap = Math.max(0.8, Math.min(2.2, ((best.colW - 6) / 4) - best.b));
  return best;
}

/* Printable code list for the teacher (names + codes). Built in the browser, never sent to Claude. */
function buildCodeListHtml(profile, label, rs) {
  const rows = (arr, g) => arr.map((v, i) => v ? `<tr><td class="c">${g}-${i + 1}</td><td>${esc(v)}</td></tr>` : "").join("");
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Code List · ${esc(label)}</title><style>
@page { size: A4 portrait; margin: 12mm; } body { font: 10pt Arial, sans-serif; color: #000; }
h1 { font-size: 13pt; margin: 0 0 1mm; } p { margin: 0 0 4mm; font-size: 8.5pt; color: #444; }
.cols { display: flex; gap: 8mm; } table { border-collapse: collapse; width: 100%; } td, th { border: 0.2mm solid #999; padding: 1.2mm 2mm; text-align: left; }
th { background: #eee; } .c { font-weight: 700; width: 14mm; font-family: monospace; }
</style></head><body><h1>CODE LIST · ${esc(label)}</h1>
<p>${esc(up(profile.school))} · Teacher's copy. Give each learner the sheet with their code. Keep this list private.</p>
<div class="cols"><table><tr><th>Code</th><th>BOYS</th></tr>${rows(rs.boys, "B")}</table><table><tr><th>Code</th><th>GIRLS</th></tr>${rows(rs.girls, "G")}</table></div></body></html>`;
}

/* ===================== ANSWER SHEETS: exact millimetre geometry (shared by printing AND the bubble reader) ===================== */
/* Every position below is in mm inside one 105 x 148.5 mm quarter-sheet. The reader uses the SAME numbers. */
const GEO = {
  W: 105, H: 148.5,
  corners: [[4, 4], [96, 4], [4, 139.5], [96, 139.5]], cornerSize: 5,          // black squares; centers 6.5 mm from the edges
  itemsTop: 46.2, itemsLeft: 6, colGap: 1.6,
  codeBox: { x: 79, y: 19.5, w: 20, h: 18.5 },
  dots: { x0: 80.2, y: 33.4, size: 1.6, step: 2.0, count: 9 },                 // CODE dot strip inside the box
  paperProbe: [[20, 138.6], [35, 138.6], [50, 138.6], [65, 138.6], [80, 138.6], [52.5, 41.9], [30, 20.5], [70, 20.5]],
};
/* Dot code, 9 cells: [start=1, isGirl, isKey, n5 n4 n3 n2 n1 n0] -> B-1..B-63, G-1..G-63, KEY */
function codeToBits(code) {
  const c = up(code).replace(/\s/g, "");
  if (c === "KEY") return [1, 0, 1, 0, 0, 0, 0, 0, 0];
  const m = c.match(/^([BG])-?(\d{1,2})$/); if (!m) return null;
  const n = +m[2]; if (n < 1 || n > 63) return null;
  return [1, m[1] === "G" ? 1 : 0, 0, ...[5, 4, 3, 2, 1, 0].map(b => (n >> b) & 1)];
}
function bitsToCode(bits) {
  if (!bits || bits[0] !== 1) return null;
  if (bits[2]) return bits[1] || bits.slice(3).some(Boolean) ? null : "KEY";
  const n = bits.slice(3).reduce((t, b) => t * 2 + b, 0);
  return n >= 1 ? `${bits[1] ? "G" : "B"}-${n}` : null;
}
/* Where each bubble's center is (mm, sheet-local). */
function bubbleCenters(n) {
  const L = sheetLayout(n), noW = Math.max(4.4, L.b * 1.3), out = [];
  for (let q = 1; q <= n; q++) {
    const c = Math.floor((q - 1) / L.rows), r = (q - 1) % L.rows;
    const cx = GEO.itemsLeft + c * (L.colW + GEO.colGap);
    const cy = GEO.itemsTop + 3.4 + r * L.rowH + L.rowH / 2;
    out.push([0, 1, 2, 3].map(k => [cx + noW + L.b / 2 + k * (L.b + L.gap), cy]));
  }
  return { L, noW, centers: out };
}

/* Draw one quarter-sheet at (ox, oy). learner = {code, name} (code "" = blank sheet to fill by hand) */
function drawSheetCell(pen, o, learner, ox, oy) {
  const X = v => ox + v, Y = v => oy + v;
  const { L, noW, centers } = bubbleCenters(o.n);
  const reg = up(o.profile.region) || "REGION", div = up(o.profile.division) || "SCHOOLS DIVISION";
  const school = up(o.profile.school) || "SCHOOL NAME";

  const base = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: PBKDF2_ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function aesEnc(key, bytes) { const iv = rand(12); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes); return { iv: b64(iv), ct: b64(ct) }; }
async function aesDec(key, box) { return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct))); }
async function wrapWithSecret(rawDek, secret) { const salt = rand(16); const kek = await kekFromSecret(secret, salt); return { salt: b64(salt), ...(await aesEnc(kek, rawDek)) }; }
async function unwrapWithSecret(w, secret) { const kek = await kekFromSecret(secret, unb64(w.salt)); return aesDec(kek, w); }
/* admin: ECDH P-256 */
async function wrapForAdmin(rawDek, adminKey) {
  const pub = await crypto.subtle.importKey("jwk", adminKey.pub, { name: "ECDH", namedCurve: "P-256" }, false, []);
  const eph = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "ECDH", public: pub }, eph.privateKey, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  return { eph: await crypto.subtle.exportKey("jwk", eph.publicKey), kid: adminKey.kid, ...(await aesEnc(k, rawDek)) };
}
async function unwrapForAdmin(w, adminKey, master) {
  const pkcs8 = await unwrapWithSecret(adminKey.privEnc, master);             // wrong master password -> throws
  const priv = await crypto.subtle.importKey("pkcs8", pkcs8, { name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
  const eph = await crypto.subtle.importKey("jwk", w.eph, { name: "ECDH", namedCurve: "P-256" }, false, []);
  const k = await crypto.subtle.deriveKey({ name: "ECDH", public: eph }, priv, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return aesDec(k, w);
}
async function createAdminKey(master) {
  const kp = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
  const pkcs8 = new Uint8Array(await crypto.subtle.exportKey("pkcs8", kp.privateKey));
  return { type: "jordynai-admin-key", version: 1, kid: b64(rand(6)), created: new Date().toISOString(), pub: await crypto.subtle.exportKey("jwk", kp.publicKey), privEnc: await wrapWithSecret(pkcs8, master) };
}
const newRecoveryCode = () => Array.from(rand(12), b => RECOVERY_WORDS[b]).join(" ");
const normCode = s => String(s || "").toLowerCase().trim().split(/\s+/).join(" ");

const Vault = {
  map: null, dek: null, rawDek: null, wraps: null, saveTimer: null, adminKey: null, unlockedBy: "",
  exists() { try { return !!localStorage.getItem(VAULT_KEY); } catch (e) { return false; } },
  isOpen() { return !!this.map; },
  async loadAdminKey() {
    if (this.adminKey !== null) return this.adminKey;
    try { const r = await fetch("admin-key.json", { cache: "no-store" }); const j = r.ok ? await r.json() : null; this.adminKey = j && j.type === "jordynai-admin-key" ? j : false; }
    catch (e) { this.adminKey = false; }
    return this.adminKey;
  },
  async open(rawDek, wraps, by) {
    this.rawDek = rawDek; this.wraps = wraps; this.unlockedBy = by;
    this.dek = await crypto.subtle.importKey("raw", rawDek, "AES-GCM", false, ["encrypt", "decrypt"]);
    const v = JSON.parse(localStorage.getItem(VAULT_KEY));
    this.map = v.data ? JSON.parse(dec.decode(await aesDec(this.dek, v.data))) : {};
    const ak = await this.loadAdminKey();                                       // add the admin lock if it's missing or outdated
    if (ak && (!wraps.admin || wraps.admin.kid !== ak.kid)) { this.wraps.admin = await wrapForAdmin(rawDek, ak); await this.save(); }
  },
  async create(password) {
    const rawDek = rand(32), code = newRecoveryCode();
    const wraps = { pw: await wrapWithSecret(rawDek, password), rc: await wrapWithSecret(rawDek, normCode(code)) };
    const ak = await this.loadAdminKey(); if (ak) wraps.admin = await wrapForAdmin(rawDek, ak);
    // move any existing plain data into the vault
    const map = {}; Object.keys(localStorage).filter(k => k.startsWith("jordynai_") && k !== VAULT_KEY).forEach(k => { try { map[k] = JSON.parse(localStorage.getItem(k)); } catch (e) {} });
    localStorage.setItem(VAULT_KEY, JSON.stringify({ v: 1, wraps, data: null }));
    this.rawDek = rawDek; this.wraps = wraps; this.unlockedBy = "password";
    this.dek = await crypto.subtle.importKey("raw", rawDek, "AES-GCM", false, ["encrypt", "decrypt"]);
    this.map = map; await this.save();
    Object.keys(map).forEach(k => localStorage.removeItem(k));
    return code;
  },
  async unlock(kind, secret) {
    const v = JSON.parse(localStorage.getItem(VAULT_KEY)), w = v.wraps;
    let raw;
    if (kind === "password") raw = await unwrapWithSecret(w.pw, secret);
    else if (kind === "recovery") raw = await unwrapWithSecret(w.rc, normCode(secret));
    else { const ak = await this.loadAdminKey(); if (!ak || !w.admin) throw new Error("no-admin"); raw = await unwrapForAdmin(w.admin, ak, secret); }
    await this.open(raw, w, kind);
  },
  async setPassword(newPw) { this.wraps.pw = await wrapWithSecret(this.rawDek, newPw); await this.save(); },
  async newRecovery() { const code = newRecoveryCode(); this.wraps.rc = await wrapWithSecret(this.rawDek, normCode(code)); await this.save(); return code; },
  async save() {
    const map = this.map, dek = this.dek, wraps = this.wraps;   // captured now: lock() may clear them while this runs
    if (!map || !dek) return;
    const data = await aesEnc(dek, enc.encode(JSON.stringify(map)));
    localStorage.setItem(VAULT_KEY, JSON.stringify({ v: 1, wraps, data }));
  },
  get(k, fb) { const v = this.map ? this.map[k] : undefined; return v == null ? fb : JSON.parse(JSON.stringify(v)); },
  set(k, v) { if (!this.map) return false; if (v == null) delete this.map[k]; else this.map[k] = v; clearTimeout(this.saveTimer); this.saveTimer = setTimeout(() => this.save(), 250); return true; },
  async flush() { clearTimeout(this.saveTimer); await this.save(); },
  lock() { clearTimeout(this.saveTimer); this.save(); this.map = null; this.dek = null; this.rawDek = null; this.wraps = null; this.unlockedBy = ""; },
  erase() { this.lock(); try { Object.keys(localStorage).filter(k => k.startsWith("jordynai_")).forEach(k => localStorage.removeItem(k)); } catch (e) {} },
};

/* ===================== STORAGE (Claude db, else this browser) ===================== */
const store = {
  db: null, uid: null, ready: false,
  async init() {
    if (this.ready) return;
    try {
      const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
      const user = window.claude && window.claude.use ? await window.claude.use("user") : null;
      if (db && user) { this.uid = await user.id(); this.db = db; }
    } catch (e) { this.db = null; }
    this.ready = true;
  },
  ref(k) { return this.db.collection("data/users/" + this.uid).doc(k); },
  async get(k, fallback) {
    try {
      if (this.db) {
        const snap = await this.ref(k).get();
        const d = snap && (typeof snap.data === "function" ? snap.data() : snap.data !== undefined ? snap.data : snap);
        if (d && typeof d.v === "string") { const v = JSON.parse(d.v); return v == null ? fallback : v; }
        return fallback;
      }
      if (Vault.isOpen()) return Vault.get("jordynai_" + k, fallback);
      const raw = localStorage.getItem("jordynai_" + k);
      const v = raw ? JSON.parse(raw) : null; return v == null ? fallback : v;
    } catch (e) { return fallback; }
  },
  async set(k, value) {
    try {
      if (this.db) { await this.ref(k).set({ v: JSON.stringify(value), at: Date.now() }); return true; }
      if (Vault.isOpen()) return Vault.set("jordynai_" + k, value);
      localStorage.setItem("jordynai_" + k, JSON.stringify(value)); return true;
    } catch (e) { return false; }
  },
};

Layout: four black corner squares and a school header. Top right is a box labeled "CODE" with a printed or handwritten learner code such as B-1, B-12, G-3 (B = boy, G = girl), or the words "ANSWER KEY" (the teacher's key sheet). Beside it are printed lines: Exam, Grade & Section, Subject.
Below are ${n} numbered items, each with four bubbles A B C D, arranged in columns. Read the item numbers printed beside the bubbles.
Older sheets may instead have a "LEARNER ID" bubble box (TYPE: BOY/GIRL/KEY, TENS 0-5, ONES 0-9); if so, build the code from it (BOY + 0 + 7 = B-7).
If the code box is empty, read a handwritten code if any.\nPrivacy rule: do NOT read, copy or report any person's name, even if one is written on the sheet.
If the photo shows more than one sheet, read ONLY the sheet that is most complete and centered, and say so in "note".

Read only what is SHADED (filled dark). Rules:
- An item with no shaded bubble -> null.

- Never guess an answer from context.
Reply with ONLY this JSON:
{"code":"B-12"|"G-3"|"KEY"|null,"answers":{"1":"A"|"B"|"C"|"D"|null, ... through "${n}"},"flagged":[item numbers],"note":"short note if the photo is blurry, cut off or not an answer sheet, else empty"}`;

/* ===================== SHEET ALIGNER (frame = answer sheet shape 105 x 148.5 mm) ===================== */
const SHEET_RATIO = 148.5 / 105;            // 1 : 1.414, same as one quarter-sheet
const OUT_W = 1050, OUT_H = 1485;           // 10 px per mm crop sent to Claude
function frameSize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const maxW = Math.min(vw * 0.92, 560);    // phones: almost full width; tablets: capped so it stays easy to see
  const maxH = vh * 0.66;                   // leave room for the buttons
  const w = Math.max(220, Math.min(maxW, maxH / SHEET_RATIO));
  return { w: Math.round(w), h: Math.round(w * SHEET_RATIO) };
}


/* Find the sheet's 4 black corner squares in a photo. Returns their centers in image pixels, or null. */
function findCorners(img) {
  const M = 520, k = M / Math.max(img.naturalWidth, img.naturalHeight);
  const W = Math.round(img.naturalWidth * k), H = Math.round(img.naturalHeight * k);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, W, H);
  const px = ctx.getImageData(0, 0, W, H).data;
  let sum = 0; const g = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) { g[i] = (px[i * 4] * 0.3 + px[i * 4 + 1] * 0.59 + px[i * 4 + 2] * 0.11) | 0; sum += g[i]; }
  const thr = Math.min(90, (sum / (W * H)) * 0.45);
  const seen = new Uint8Array(W * H), blobs = [];
  for (let i = 0; i < W * H; i++) {
    if (seen[i] || g[i] > thr) continue;
    let minx = W, maxx = 0, miny = H, maxy = 0, n = 0, sx = 0, sy = 0; const st = [i]; seen[i] = 1;
    while (st.length) {
      const j = st.pop(), x = j % W, y = (j / W) | 0; n++; sx += x; sy += y;
      if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
      for (const q of [j - 1, j + 1, j - W, j + W]) if (q >= 0 && q < W * H && !seen[q] && g[q] <= thr && Math.abs((q % W) - x) <= 1) { seen[q] = 1; st.push(q); }
    }
    const bw = maxx - minx + 1, bh = maxy - miny + 1, area = W * H;
    if (n > area * 0.00015 && n < area * 0.02 && bw / bh > 0.6 && bw / bh < 1.6 && n / (bw * bh) > 0.65) blobs.push({ x: sx / n, y: sy / n, n });
  }
  if (blobs.length < 4) return null;
  const pickBy = f => blobs.reduce((a, b) => (f(b) > f(a) ? b : a));
  const tl = pickBy(b => -(b.x + b.y)), br = pickBy(b => b.x + b.y), tr = pickBy(b => b.x - b.y), bl = pickBy(b => b.y - b.x);
  const pts = [tl, tr, bl, br];
  if (new Set(pts).size < 4) return null;
  const wTop = Math.hypot(tr.x - tl.x, tr.y - tl.y), hLeft = Math.hypot(bl.x - tl.x, bl.y - tl.y);
  const ratio = hLeft / wTop;                     // corner-to-corner: (148.5-13)/(105-13) ≈ 1.47
  if (ratio < 1.25 || ratio > 1.75 || wTop < W * 0.15) return null;
  return pts.map(p => ({ x: p.x / k, y: p.y / k }));
}
/* Best-fit move + turn + zoom (similarity) that puts the 4 corners on the 4 guide squares. */
function fitCorners(img, corners, box) {
  const g = box.w * (5 / 105), inset = box.w * (4 / 105), c0 = inset + g / 2;
  const targets = [[c0, c0], [box.w - c0, c0], [c0, box.h - c0], [box.w - c0, box.h - c0]].map(([x, y]) => [x - box.w / 2, y - box.h / 2]);
  const src = corners.map(p => [p.x - img.naturalWidth / 2, p.y - img.naturalHeight / 2]);
  const ms = [0, 1].map(d => src.reduce((t, p) => t + p[d], 0) / 4), mt = [0, 1].map(d => targets.reduce((t, p) => t + p[d], 0) / 4);
  let num1 = 0, num2 = 0, den = 0;
  src.forEach((p, i) => { const qx = p[0] - ms[0], qy = p[1] - ms[1], X = targets[i][0] - mt[0], Y = targets[i][1] - mt[1]; num1 += qx * X + qy * Y; num2 += qx * Y - qy * X; den += qx * qx + qy * qy; });
  const a = num1 / den, b = num2 / den;
  return { s: Math.hypot(a, b), rot: Math.atan2(b, a) * 180 / Math.PI, tx: mt[0] - (a * ms[0] - b * ms[1]), ty: mt[1] - (b * ms[0] + a * ms[1]) };
}

function SheetAligner({ file, index, total, onDone, onSkip, onCancel }) {
  const [url] = useState(() => URL.createObjectURL(file));
  const [img, setImg] = useState(null);
  const [box, setBox] = useState(frameSize());
  const [v, setV] = useState({ s: 1, tx: 0, ty: 0, rot: 0, base: 1 });
  const ptrs = useRef(new Map());
  const pinch = useRef(null);
  const [auto, setAuto] = useState(null);   // "found" | "notfound"
  const autoAlign = (im, b = box) => { try { const cs = findCorners(im); if (cs) { const f = fitCorners(im, cs, b); const base = fit(im, 0, b).base; setV({ ...f, base }); setAuto("found"); return true; } } catch (e) {} setAuto("notfound"); return false; };

  useEffect(() => () => URL.revokeObjectURL(url), [url]);
  useEffect(() => { const on = () => setBox(frameSize()); window.addEventListener("resize", on); return () => window.removeEventListener("resize", on); }, []);
  const fit = (im, rot, b = box) => {
    const iw = rot % 180 ? im.naturalHeight : im.naturalWidth, ih = rot % 180 ? im.naturalWidth : im.naturalHeight;
    const base = Math.max(b.w / iw, b.h / ih);   // cover the frame
    return { s: base, tx: 0, ty: 0, rot, base };
  };
  useEffect(() => { const im = new Image(); im.onload = () => { setImg(im); setV(fit(im, 0)); autoAlign(im); }; im.src = url; }, [url]);
  useEffect(() => { if (img && !autoAlign(img, box)) setV(x => fit(img, x.rot, box)); }, [box.w]);

  const clampS = s => Math.max(v.base * 0.4, Math.min(v.base * 5, s));
  const down = e => { e.currentTarget.setPointerCapture(e.pointerId); ptrs.current.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.current.size === 2) { const [a, b] = [...ptrs.current.values()]; pinch.current = { d: Math.hypot(a.x - b.x, a.y - b.y), s: v.s }; } };
  const move = e => {
    const p = ptrs.current.get(e.pointerId); if (!p) return;
    const nx = e.clientX, ny = e.clientY;
    if (ptrs.current.size === 1) setV(x => ({ ...x, tx: x.tx + nx - p.x, ty: x.ty + ny - p.y }));
    ptrs.current.set(e.pointerId, { x: nx, y: ny });
    if (ptrs.current.size === 2 && pinch.current) { const [a, b] = [...ptrs.current.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); setV(x => ({ ...x, s: clampS(pinch.current.s * d / pinch.current.d) })); }
  };
  const up = e => { ptrs.current.delete(e.pointerId); if (ptrs.current.size < 2) pinch.current = null; };
  const wheel = e => { e.preventDefault(); setV(x => ({ ...x, s: clampS(x.s * (e.deltaY < 0 ? 1.08 : 1 / 1.08)) })); };
  const rotate = () => img && setV(x => ({ ...fit(img, (x.rot + 90) % 360) }));

  const confirm = () => {
    const c = document.createElement("canvas"); c.width = OUT_W; c.height = OUT_H;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, OUT_W, OUT_H);
    const k = OUT_W / box.w;
    ctx.translate(OUT_W / 2 + v.tx * k, OUT_H / 2 + v.ty * k); ctx.rotate(v.rot * Math.PI / 180); ctx.scale(v.s * k, v.s * k);
    ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
    c.toBlob(b => b && onDone(b), "image/jpeg", 0.92);
  };

  // guide squares sit exactly where the sheet's black corners are: 4 mm inset, 5 mm size (of 105 mm width)
  const g = box.w * (5 / 105), inset = box.w * (4 / 105);
  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[70] bg-slate-950/95 flex flex-col items-center justify-start overflow-y-auto p-3 select-none">

      </div>
      {auto === "found" && <p className="text-xs text-emerald-300 mb-1 text-center">✔ Corners found automatically. Check that the 4 black corners sit on the guides, then tap Use this sheet.</p>}
      {auto === "notfound" && <p className="text-xs text-amber-300 mb-1 text-center">Couldn't find the 4 corners automatically. Align by hand (or retake with all 4 corners visible).</p>}
      <p className="text-xs text-cyan-200 mb-2 text-center max-w-xl">Drag to move · pinch (or scroll) to zoom · put the sheet's <b>4 black corners</b> on the 4 white guide squares.</p>
      <div className="relative overflow-hidden rounded-lg bg-black touch-none shadow-2xl ring-2 ring-cyan-400" style={{ width: box.w, height: box.h }}
        onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onWheel={wheel}>
        {img && <img src={url} alt="sheet" draggable="false" className="absolute left-1/2 top-1/2 max-w-none pointer-events-none"
          style={{ width: img.naturalWidth, height: img.naturalHeight, transform: `translate(-50%,-50%) translate(${v.tx}px,${v.ty}px) rotate(${v.rot}deg) scale(${v.s})`, transformOrigin: "center" }} />}
        {!img && <p className="absolute inset-0 flex items-center justify-center text-slate-400 text-sm">Loading photo…</p>}
        {[["left", "top"], ["right", "top"], ["left", "bottom"], ["right", "bottom"]].map(([x, y]) =>
          <span key={x + y} className="absolute pointer-events-none border-2 border-white shadow-[0_0_0_2px_rgba(6,182,212,.9)]" style={{ [x]: inset, [y]: inset, width: g, height: g }} />)}
        <div className="absolute inset-0 pointer-events-none" style={{ backgroundImage: "linear-gradient(rgba(34,211,238,.18) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,.18) 1px, transparent 1px)", backgroundSize: `${box.w / 3}px ${box.h / 3}px` }} />
      </div>
      <div className="w-full max-w-xl mt-3 flex items-center gap-2">
        <span className="text-xs text-slate-400">Zoom</span>
        <input type="range" min={v.base * 0.4} max={v.base * 5} step={v.base / 100} value={v.s} onChange={e => setV(x => ({ ...x, s: +e.target.value }))} className="flex-1 accent-cyan-400" />
        <button onClick={rotate} className="px-3 py-1.5 text-xs rounded-lg bg-white/10">⟳ Rotate</button>
        <button onClick={() => img && autoAlign(img)} className="px-3 py-1.5 text-xs rounded-lg bg-emerald-500/20 text-emerald-200">Auto</button>
        <button onClick={() => img && setV(fit(img, v.rot))} className="px-3 py-1.5 text-xs rounded-lg bg-white/10">Reset</button>
      </div>
      <div className="w-full max-w-xl mt-3 grid grid-cols-2 gap-2">
        <button onClick={onSkip} className="py-3 rounded-xl bg-white/10 text-sm font-bold">Use whole photo</button>
        <button disabled={!img} onClick={confirm} className="py-3 rounded-xl bg-cyan-500 text-slate-950 text-sm font-black disabled:opacity-30">✔ Use this sheet</button>
      </div>
    </div>,
    document.body
  );
}

/* ===================== LIVE CAMERA (auto-capture when the 4 corners are steady) ===================== */
function LiveScanner({ n, onResult, onClose }) {
  const videoRef = useRef(null), streamRef = useRef(null);
  const [status, setStatus] = useState("Starting camera…");
  const [err, setErr] = useState("");
  const [count, setCount] = useState(0);
  const [flash, setFlashOn] = useState(false);
  const [box, setBox] = useState(frameSize());
  const state = useRef({ hist: [], lastCode: null, cooldownUntil: 0, needGone: false, gone: 0 });

  useEffect(() => {
    let alive = true, timer = null;
    (async () => {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no camera API");
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
        if (!alive) { s.getTracks().forEach(t => t.stop()); return; }
        streamRef.current = s; const v = videoRef.current; v.srcObject = s; await v.play();
        setStatus("Show ONE sheet inside the frame, with all 4 black corners visible.");
        timer = setInterval(tick, 280);
      } catch (e) {
        setErr("The live camera isn't available here. It works on the website version of the app (opened in Chrome or Safari). In the Claude app, use 📸 Take photo instead.");
      }
    })();
    const onResize = () => setBox(frameSize()); window.addEventListener("resize", onResize);
    return () => { alive = false; clearInterval(timer); window.removeEventListener("resize", onResize); if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); };
  }, []);

  const capture = (manual) => {
    const v = videoRef.current; if (!v || !v.videoWidth) return;
    const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext("2d").drawImage(v, 0, 0);
    const res = readSheet(c, n);
    if (!res.ok) { if (manual) setStatus("Couldn't find the 4 black corners. Move closer and hold steady."); return false; }
    const st = state.current;
    if (!manual && res.code && res.code === st.lastCode) { st.needGone = true; return false; }   // same sheet still in view
    st.lastCode = res.code; st.cooldownUntil = Date.now() + 1300; st.needGone = !res.code; st.gone = 0; st.hist = [];
    try { navigator.vibrate && navigator.vibrate(70); } catch (e) {}
    setFlashOn(true); setTimeout(() => setFlashOn(false), 180);
    setCount(x => x + 1);
    setStatus(res.code ? `✔ ${res.code} captured. Next sheet!` : "✔ Captured (no code dots: you'll type the code). Next sheet!");
    onResult(res, "live camera");
    return true;
  };

  const tick = () => {
    const v = videoRef.current, st = state.current; if (!v || !v.videoWidth) return;
    const small = toGray(v, 480), cc = coarseCorners(small);
    if (!cc) { st.hist = []; st.gone++; if (st.gone >= 2) { st.needGone = false; st.lastCode = null; } if (Date.now() > st.cooldownUntil) setStatus("Show ONE sheet inside the frame, with all 4 black corners visible."); return; }
    st.gone = 0;
    if (Date.now() < st.cooldownUntil || st.needGone) return;
    const p = cc.pts, w = small.W;
    st.hist.push(p); if (st.hist.length > 3) st.hist.shift();
    if (st.hist.length < 3) { setStatus("Corners found. Hold still…"); return; }
    const moved = Math.max(...st.hist[0].map((q, i) => Math.hypot(q.x - st.hist[2][i].x, q.y - st.hist[2][i].y))) / w;
    if (moved < 0.015) capture(false); else setStatus("Hold still…");
  };

  const g = box.w * (5 / 105), inset = box.w * (4 / 105);
  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[80] bg-black flex flex-col">
      <video ref={videoRef} playsInline muted className="absolute inset-0 w-full h-full object-cover" />
      {flash && <div className="absolute inset-0 bg-white/70 pointer-events-none" />}
      <div className="relative z-10 flex items-center justify-between p-3 text-white text-sm bg-gradient-to-b from-black/70 to-transparent">
        <span>🎥 Live scan · <b>{count}</b> captured</span>
        <button onClick={onClose} className="px-3 py-1.5 rounded-lg bg-white/15 font-bold">Done</button>
      </div>
      <div className="relative z-10 flex-1 flex items-center justify-center pointer-events-none">
        <div className="relative rounded-md ring-2 ring-cyan-400 shadow-[0_0_0_9999px_rgba(0,0,0,0.45)]" style={{ width: box.w, height: box.h }}>
          {[["left", "top"], ["right", "top"], ["left", "bottom"], ["right", "bottom"]].map(([x, y]) =>
            <span key={x + y} className="absolute border-2 border-white" style={{ [x]: inset, [y]: inset, width: g, height: g }} />)}
        </div>
      </div>
      <div className="relative z-10 p-3 pb-5 text-center bg-gradient-to-t from-black/80 to-transparent">
        {err ? <p className="text-amber-300 text-sm mb-3">{err}</p> : <p className="text-white text-sm mb-3">{status}</p>}
        {!err && <button onClick={() => capture(true)} className="w-16 h-16 rounded-full bg-white border-4 border-cyan-400 shadow-lg" aria-label="Capture now" />}
        <p className="text-[11px] text-slate-300 mt-2">It captures by itself when the sheet is steady. Put the next sheet in front and it continues.</p>
      </div>
    </div>,
    document.body
  );
}

/* ===================== SCANNER PANEL ===================== */
function ScanPanel({ onStudent, onKey, n, hasKey }) {
  const [sample, setSample] = useState(undefined);
  const [imgOK, setImgOK] = useState(false);
  const [items, setItems] = useState([]);   // {id, thumb, status: done|review|align|error, code, answers, flagged, msg, cropBlob, blob}
  const [aligning, setAligning] = useState(null);
  const [live, setLive] = useState(false);
  const [busyId, setBusyId] = useState("");
  useEffect(() => {
    let alive = true;
    (async () => {
      const s = window.claude && window.claude.use ? await window.claude.use("sample") : null;
      if (!alive) return;
      setSample(() => s);   // s is a function: wrap it, or React would call it as an updater
      if (s) { const lim = await s.limits().catch(() => null); if (alive) setImgOK(!!(lim && lim.images)); }
    })();
    return () => { alive = false; };
  }, []);
  const claudeOK = !!sample && imgOK;
  const patch = (id, p) => setItems(list => list.map(it => (it.id === id ? { ...it, ...p } : it)));

  const commit = (it, code, answers) => {
    const c = up(code).replace(/\s/g, "");
    if (c === "KEY") {
      if (answers.some(a => !a)) return "The answer key has blank items. Fill every item first.";
      onKey(answers.slice()); return "";
    }
    const m = c.match(/^([BG])-?(\d{1,2})$/); if (!m) return "Type a code like B-12 or G-3.";
    const id = `${m[1]}-${+m[2]}`, responses = {};
    answers.forEach((a, i) => { responses[i + 1] = a || ""; });
    onStudent({ student_id: id, student_name: "", responses }); return "";
  };

  const handleResult = async (res, name, blob) => {
    const id = Math.random().toString(36).slice(2);
    if (!res.ok) { setItems(l => [{ id, status: "align", msg: "Couldn't find the 4 black corners.", blob, name }, ...l]); return; }
    const crop = warpCrop(res, 5), thumb = crop.toDataURL("image/jpeg", 0.6), cropBlob = await canvasBlob(warpCrop(res, 8));
    if (!res.layoutOk) { setItems(l => [{ id, status: "error", thumb, cropBlob, blob, name, code: res.code || "", answers: Array(n).fill(null), flagged: [], msg: `This sheet doesn't match ${n} items. Was it printed for a different number of items? Reprint, or use Ask Claude.` }, ...l]); return; }
    const item = { id, thumb, cropBlob, blob, name, code: res.code || "", answers: res.answers.slice(), flagged: res.flagged.slice() };
    const keyBlanks = res.code === "KEY" && res.answers.some(a => !a);
    if (res.code && !res.flagged.length && !keyBlanks) {
      const e = commit(item, res.code, res.answers);
      setItems(l => [{ ...item, status: e ? "review" : "done", msg: e }, ...l]);
    } else {
      const why = [!res.code && "no code found: type it", res.flagged.length && `${res.flagged.length} item(s) to check`, keyBlanks && "key has blanks"].filter(Boolean).join(" · ");
      setItems(l => [{ ...item, status: "review", msg: why }, ...l]);
    }
  };

  const fromFile = async (file, alignedBlob) => {
    try { const img = await loadImage(alignedBlob || file); handleResult(readSheet(img, n), file.name || "photo", file); }
    catch (e) { setItems(l => [{ id: Math.random().toString(36).slice(2), status: "error", msg: "This file isn't a readable photo." }, ...l]); }
  };

  const askClaude = async it => {
    setBusyId(it.id);
    try {
      const r = await sample.json(scanPrompt(n), { images: [it.cropBlob || it.blob], cache: false });
      const ans = r.answers || {}, merged = it.answers.map((a, i) => (it.flagged.includes(i + 1) || !a || it.status === "error" ? (ans[i + 1] || ans[String(i + 1)] || a || null) : a));
      const stillFlag = (r.flagged || []).map(Number).filter(q => q >= 1 && q <= n);
      const code = it.code || up(r.code || "").replace("ANSWERKEY", "KEY");
      patch(it.id, { answers: merged, flagged: stillFlag, code, status: "review", msg: `Claude's reading filled in. Check it, then tap Save.${r.note ? " Note: " + r.note : ""}` });
    } catch (e) {
      patch(it.id, { msg: { not_granted: "Claude access was not allowed.", rate_limited: "Claude usage limit reached; fix it by hand." }[e.code] || "Claude couldn't read it; fix it by hand." });
    }
    setBusyId("");
  };

  const done = items.filter(i => i.status === "done").length, toReview = items.filter(i => i.status !== "done").length;
  return (
    <Card className="border-cyan-400/30">
      <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
        <h2 className="font-black text-white text-lg">📷 Scanner · free on-device reader</h2>
        <span className="text-xs text-slate-400">{n} items · {hasKey ? "key saved ✔" : "scan or save the KEY first"}</span>
      </div>
      <p className="text-xs text-slate-400 mb-3">Sheets are read on this device in under a second: free, offline and private (photos never leave the phone).{claudeOK ? " Claude is only a backup for unclear sheets." : ""}</p>
      <div className="grid sm:grid-cols-3 gap-2">
        <button onClick={() => setLive(true)} className="py-3 rounded-xl bg-cyan-500 text-slate-950 font-black">🎥 Live camera (auto)</button>
        <label className="py-3 rounded-xl bg-white/10 hover:bg-white/15 font-bold text-center cursor-pointer">📸 Take photo
          <input type="file" accept="image/*" capture="environment" className="hidden" onChange={e => { Array.from(e.target.files || []).forEach(f => fromFile(f)); e.target.value = ""; }} /></label>
        <label className="py-3 rounded-xl bg-white/10 hover:bg-white/15 font-bold text-center cursor-pointer">🖼️ Choose photos
          <input type="file" accept="image/jpeg,image/png,image/webp" multiple className="hidden" onChange={e => { Array.from(e.target.files || []).forEach(f => fromFile(f)); e.target.value = ""; }} /></label>
      </div>
      <p className="text-[11px] text-slate-500 mt-2">Tip: scan the ANSWER KEY sheet first. One sheet per photo, flat, good light, all 4 black corners visible.</p>

      {items.length > 0 && <p className="text-sm text-slate-300 mt-4 mb-2">✔ {done} saved{toReview ? ` · ⚠ ${toReview} need your check` : ""}</p>}
      <div className="space-y-2">
        {items.map(it => (
          <div key={it.id} className={`flex gap-3 rounded-xl p-2 border ${it.status === "done" ? "border-emerald-400/30 bg-emerald-500/5" : it.status === "review" ? "border-amber-400/40 bg-amber-500/5" : "border-red-400/40 bg-red-500/5"}`}>
            {it.thumb ? <img src={it.thumb} alt="" className="w-14 rounded bg-white shrink-0 self-start" style={{ aspectRatio: "1/1.414" }} /> : <div className="w-14 shrink-0 rounded bg-slate-800 text-[10px] text-slate-500 flex items-center justify-center" style={{ aspectRatio: "1/1.414" }}>no sheet</div>}
            <div className="flex-1 min-w-0 text-sm">
              {it.status === "done" && <p className="text-emerald-300 font-bold">✔ {it.code === "KEY" ? "ANSWER KEY saved" : `${it.code} saved`} · {it.answers.filter(Boolean).length}/{n} answered</p>}
              {it.status !== "done" && <>
                <p className={`${it.status === "review" ? "text-amber-200" : "text-red-300"} text-xs mb-1`}>{it.msg}</p>
                {it.status === "align" && <button onClick={() => setAligning(it)} className="px-3 py-1.5 text-xs rounded-lg bg-cyan-500 text-slate-950 font-bold">Align by hand</button>}
                {(it.status === "review" || it.status === "error") && <>
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-xs text-slate-400">Code</span>
                    <input value={it.code} onChange={e => patch(it.id, { code: up(e.target.value) })} placeholder="B-12" className="w-24 bg-slate-900/70 border border-white/15 rounded px-2 py-1 text-xs font-mono text-white" />
                  </div>
                  {it.flagged.length > 0 && <div className="flex flex-wrap gap-x-3 gap-y-1 mb-1">
                    {it.flagged.map(q => <span key={q} className="flex items-center gap-1 text-xs"><b className="text-amber-200 w-6 text-right">{q}</b>
                      {["A", "B", "C", "D", ""].map(l => <button key={l || "x"} onClick={() => patch(it.id, { answers: it.answers.map((a, i) => (i === q - 1 ? (l || null) : a)) })}
                        className={`w-5 h-5 rounded-full text-[9px] font-bold border ${(it.answers[q - 1] || "") === l ? "bg-cyan-400 text-slate-950 border-cyan-300" : "border-white/25 text-slate-300"}`}>{l || "–"}</button>)}</span>)}
                  </div>}
                  <div className="flex flex-wrap gap-2 mt-1">
                    {it.status === "review" && <button onClick={() => { const e = commit(it, it.code, it.answers); if (e) patch(it.id, { msg: e }); else patch(it.id, { status: "done", code: up(it.code), msg: "" }); }} className="px-3 py-1.5 text-xs rounded-lg bg-emerald-500 text-slate-950 font-bold">Save</button>}
                    {claudeOK && <button disabled={busyId === it.id} onClick={() => askClaude(it)} className="px-3 py-1.5 text-xs rounded-lg bg-white/10 disabled:opacity-40">{busyId === it.id ? "Asking Claude…" : "Ask Claude"}</button>}
                    <button onClick={() => setItems(l => l.filter(x => x.id !== it.id))} className="px-3 py-1.5 text-xs rounded-lg bg-white/5 text-slate-400">Remove</button>
                  </div>
                  {it.flagged.length > 0 && <p className="text-[10px] text-slate-500 mt-1">Look at the paper for these items (double, light or erased marks) and tap the right letter, or – for blank.</p>}
                </>}
              </>}
            </div>
          </div>))}
      </div>
      {live && <LiveScanner n={n} onClose={() => setLive(false)} onResult={res => handleResult(res, "live camera", null)} />}
      {aligning && <SheetAligner file={aligning.blob} index={0} total={1}
        onDone={async b => { const it = aligning; setAligning(null); setItems(l => l.filter(x => x.id !== it.id)); fromFile(it.blob, b); }}
        onSkip={() => setAligning(null)} onCancel={() => setAligning(null)} />}
    </Card>
  );
}

/* ===================== CLASS ROSTER (masterlist) ===================== */
const ROSTER_ROWS = 50;
const rosterKey = label => "roster_" + String(label).replace(/[^\w]+/g, "_");
const sectionOf = label => String(label).split(" – ").slice(1).join(" – ") || label;
/* One pasted line -> a learner name. Handles "1. DELA CRUZ, JUAN", "B1  DELA CRUZ, JUAN", Excel rows with tabs (LRN, No., Name…). */
function cleanName(line) {
  let cells = String(line).split("\t").map(c => c.trim()).filter(Boolean);
  if (!cells.length) return "";
  // Excel row: keep the cells that have letters (drop numbers / LRN / sex columns), prefer the one with a comma
  const lettered = cells.filter(c => /[A-Za-zÑñ]{2,}/.test(c) && !/^(M|F|MALE|FEMALE)$/i.test(c));
  let name = lettered.find(c => c.includes(",")) || lettered.join(" ") || "";
  name = name.replace(/^\s*(?:[BG]\s*-?\s*)?\d+\s*[.)\-:]?\s+/i, "");   // leading "1." "B1" "B-1 " numbering
  name = name.replace(/\s+/g, " ").trim();
  return up(name);
}
const parseNames = text => String(text || "").split(/\r?\n/).map(cleanName).filter(Boolean);

/* "LAST, GIVEN, MIDDLE" -> "LAST, GIVEN M." (full middle name becomes its initial) */
function toMiddleInitial(name) {
  const m = String(name).match(/^([^,]+),\s*([^,]+),\s*(.+)$/);
  if (!m) return name;
  const mid = m[3].trim();
  const initial = mid[0];
  return `${m[1].trim()}, ${m[2].trim()} ${initial ? initial.toUpperCase() + "." : ""}`.trim();
}
const collator = new Intl.Collator("es", { sensitivity: "base" });   /* Spanish order puts Ñ after N, as in Filipino class records */
const lastNameOf = nm => String(nm).split(",")[0].trim();
const compareNames = (a, b) => collator.compare(lastNameOf(a), lastNameOf(b)) || collator.compare(a, b);
/* Rows that break A–Z order or leave a gap between names -> Set of row indexes */
function orderProblems(arr) {
  const bad = new Set(); let lastIdx = -1;
  const lastFilled = arr.reduce((m, v, i) => (v ? i : m), -1);
  arr.forEach((v, i) => {
    if (!v) { if (i < lastFilled) bad.add(i); return; }
    if (lastIdx >= 0 && compareNames(arr[lastIdx], v) > 0) { bad.add(lastIdx); bad.add(i); }
    lastIdx = i;
  });
  return bad;
}

function RosterPage({ label, initial, onSave, onBack, onDownload, onCodeList, flash }) {
  const blank = () => Array(ROSTER_ROWS).fill("");
  const fit = arr => { const a = blank(); (arr || []).slice(0, ROSTER_ROWS).forEach((v, i) => { a[i] = v || ""; }); return a; };
  const [boys, setBoys] = useState(fit(initial && initial.boys));
  const [girls, setGirls] = useState(fit(initial && initial.girls));
  const [paste, setPaste] = useState({ B: "", G: "" });
  const [dirty, setDirty] = useState(false);
  const [checking, setChecking] = useState(false);
  const [bad, setBad] = useState({ B: new Set(), G: new Set() });
  const [saved, setSaved] = useState(!!(initial && (initial.boys || []).some(Boolean)));
  const [grade, sec] = [String(label).split(" – ")[0], sectionOf(label)];
  const saveLabel = `Save Learners in ${grade} – Section ${sec}`;

  const set = (g, arr) => { (g === "B" ? setBoys : setGirls)(arr); setDirty(true); setSaved(false); setBad(b => ({ ...b, [g]: new Set() })); };
  const applyPaste = (g, startAt = 0, text) => {
    const names = parseNames(text != null ? text : paste[g]).map(toMiddleInitial);
    if (!names.length) return flash("Nothing to paste. Copy the names from your class record first.");
    const arr = (g === "B" ? boys : girls).slice();
    const extra = Math.max(0, startAt + names.length - ROSTER_ROWS);
    names.slice(0, ROSTER_ROWS - startAt).forEach((nm, k) => { arr[startAt + k] = nm; });
    set(g, arr); if (text == null) setPaste({ ...paste, [g]: "" });
    flash(`${Math.min(names.length, ROSTER_ROWS - startAt)} ${g === "B" ? "boys" : "girls"} filled from ${g}-${startAt + 1}.` + (extra ? ` ${extra} name(s) did not fit (max ${ROSTER_ROWS}).` : ""));
  };

function Gate({ children }) {
  const [phase, setPhase] = useState("loading");      // loading | open | setup | locked | recovery
  const [mode, setMode] = useState("password");       // password | recovery | admin
  const [a, setA] = useState(""), [b, setB] = useState("");
  const [err, setErr] = useState(""), [busy, setBusy] = useState(false);
  const [code, setCode] = useState("");
  const [hasAdmin, setHasAdmin] = useState(false);
  const [byAdmin, setByAdmin] = useState(false);
  const idle = useRef(null);

  useEffect(() => { (async () => {
    await store.init();
    if (store.db) { setPhase("open"); return; }                // inside Claude: protected by the Claude account
    setHasAdmin(!!(await Vault.loadAdminKey()));
    setPhase(Vault.exists() ? "locked" : "setup");
  })(); }, []);

  // auto-lock after 15 minutes without activity
  useEffect(() => {
    if (phase !== "open" || store.db) return;
    const reset = () => { clearTimeout(idle.current); idle.current = setTimeout(lockNow, IDLE_MS); };
    const evs = ["pointerdown", "keydown", "scroll", "touchstart"];
    evs.forEach(e => window.addEventListener(e, reset, { passive: true })); reset();
    window.__jordynLock = lockNow;
    return () => { clearTimeout(idle.current); evs.forEach(e => window.removeEventListener(e, reset)); };
  }, [phase]);

  function lockNow() { Vault.lock(); setA(""); setB(""); setErr(""); setMode("password"); setByAdmin(false); setPhase("locked"); }

  const create = async () => {
    const p = pwProblem(a, b); if (p) return setErr(p);
    setBusy(true); setErr("");
    try { const c = await Vault.create(a); setCode(c); setPhase("recovery"); setA(""); setB(""); } catch (e) { setErr("Couldn't create the lock on this browser."); }
    setBusy(false);
  };
  const unlock = async () => {
    if (!a) return; setBusy(true); setErr("");
    try { await Vault.unlock(mode, a); setA(""); setByAdmin(mode !== "password"); setPhase("open"); }
    catch (e) { setErr(mode === "admin" ? (e.message === "no-admin" ? "No admin key is set up for this website yet." : "Wrong master password.") : mode === "recovery" ? "That recovery code doesn't match." : "Wrong password."); }
    setBusy(false);
  };

  if (phase === "loading") return <div className="min-h-screen flex items-center justify-center text-cyan-300">Loading JordynAI…</div>;
  if (phase === "open") return <>
    {byAdmin && <div className="bg-amber-500/20 border-b border-amber-400/40 text-amber-100 text-xs text-center p-2">Unlocked with the {Vault.unlockedBy === "admin" ? "admin master password" : "recovery code"}. Set a new password in History → Security.</div>}
    {children}
  </>;
  if (phase === "recovery") return <GateShell><RecoveryShow code={code} onDone={() => { setCode(""); setPhase("open"); }} /></GateShell>;
  if (phase === "setup") return (
    <GateShell>
      <h2 className="text-lg font-black text-white mb-1">🔒 Create your password</h2>
      <p className="text-sm text-slate-300 mb-3">Your classes, learner lists and results on this device will be <b>encrypted</b> with this password. Each teacher sets their own password on their own device.{hasAdmin ? " The school admin's master password can also open it if you forget yours." : ""}</p>
      <div className="space-y-2">
        <PwInput placeholder="New password (8+ characters)" value={a} onChange={e => setA(e.target.value)} />
        <PwInput placeholder="Type it again" value={b} onChange={e => setB(e.target.value)} onKeyDown={e => e.key === "Enter" && create()} />
      </div>
      {err && <p className="text-sm text-red-300 mt-2">{err}</p>}
      <button disabled={busy} onClick={create} className="w-full mt-4 py-3 rounded-xl bg-cyan-500 text-slate-950 font-black disabled:opacity-40">{busy ? "Setting up…" : "Create password"}</button>
    </GateShell>
  );
  // locked
  return (
    <GateShell>
      <div className="flex gap-1 bg-slate-900/60 rounded-xl p-1 mb-3 text-xs">
        {[["password", "Password"], ["recovery", "Recovery code"], ...(hasAdmin ? [["admin", "Admin"]] : [])].map(([k, l]) =>
          <button key={k} onClick={() => { setMode(k); setA(""); setErr(""); }} className={`flex-1 py-2 rounded-lg ${mode === k ? "bg-cyan-500 text-slate-950 font-bold" : "text-slate-300"}`}>{l}</button>)}
      </div>
      {mode === "password" && <PwInput autoFocus placeholder="Password" value={a} onChange={e => setA(e.target.value)} onKeyDown={e => e.key === "Enter" && unlock()} />}
      {mode === "admin" && <><p className="text-xs text-slate-400 mb-2">For the school admin only.</p><PwInput autoFocus placeholder="Admin master password" value={a} onChange={e => setA(e.target.value)} onKeyDown={e => e.key === "Enter" && unlock()} /></>}
      {mode === "recovery" && <><p className="text-xs text-slate-400 mb-2">Type your 12 words with spaces between them.</p>
        <textarea autoFocus value={a} onChange={e => setA(e.target.value)} rows={3} className="w-full bg-slate-900/70 border border-white/10 rounded-lg px-3 py-2 text-slate-100 font-mono text-sm outline-none focus:ring-2 focus:ring-cyan-400" /></>}
      {err && <p className="text-sm text-red-300 mt-2">{err}</p>}
      <button disabled={busy || !a} onClick={unlock} className="w-full mt-4 py-3 rounded-xl bg-cyan-500 text-slate-950 font-black disabled:opacity-40">{busy ? "Unlocking…" : "🔓 Unlock"}</button>
      <details className="mt-4 text-xs text-slate-500">
        <summary className="cursor-pointer">Forgot everything?</summary>
        <p className="mt-2">Without your password, your recovery code or the admin, the data on this device can't be opened. You can erase it and start fresh.</p>
        <button onClick={() => { if (window.__eraseArmed) { Vault.erase(); window.location.reload(); } else { window.__eraseArmed = true; setErr("Tap 'Erase this device' again to confirm. Everything on this device will be deleted."); } }} className="mt-2 px-3 py-1.5 rounded-lg bg-red-600/80 text-white font-bold">Erase this device</button>
      </details>
    </GateShell>
  );
}

  const change = async () => {
    const p = pwProblem(p1, p2); if (p) return setMsg(p);
    setBusy(true); setMsg("");
    try {
      if (Vault.unlockedBy === "password") { const v = JSON.parse(localStorage.getItem(VAULT_KEY)); await unwrapWithSecret(v.wraps.pw, cur); }   // check current password
      await Vault.setPassword(p1); setCur(""); setP1(""); setP2(""); setMsg("✔ Password changed."); flash("Password changed.");
    } catch (e) { setMsg("Your current password is wrong."); }

    setBusy(true);
    try { const k = await createAdminKey(m1); await saveFile(JSON.stringify(k, null, 2), "admin-key.json", "application/json"); setM1(""); setM2(""); setAdminMsg("✔ admin-key.json created. Send this file to Claude (or upload it to the website repo) to switch the admin lock on. Keep your master password secret; it is not in the file."); }
    catch (e) { setAdminMsg("Couldn't create the admin key."); }

  };
  return (
    <Card>
      <h3 className="font-black text-white mb-1">🔒 Security</h3>
      <p className="text-xs text-slate-400 mb-3">Data on this device is encrypted. Auto-lock after 15 minutes without use. Admin lock: {Vault.adminKey ? <b className="text-emerald-300">ON</b> : <b className="text-amber-300">not set up</b>}.</p>

        <PwInput placeholder="New password" value={p1} onChange={e => setP1(e.target.value)} />

      </div>
      <button disabled={busy} onClick={change} className="mt-2 px-4 py-2 text-sm rounded-lg bg-cyan-500 text-slate-950 font-bold disabled:opacity-40">Change password</button>

        <div className="grid sm:grid-cols-2 gap-2 mt-2">

  const addClass = async () => {

  const downloadCodeList = (label, rs) => saveFile(buildCodeListHtml(profile, label, rs), `Code_List_${String(label).replace(/[^\w]+/g, "_")}.html`, "text/html;charset=utf-8");
  const downloadSheets = async (label, rs, kind = "pdf") => {

  const rosterCount = label => { const r = rosters[label]; return r ? r.boys.filter(Boolean).length + r.girls.filter(Boolean).length : 0; };
  const removeClass = async label => { const cl = classes.filter(x => x !== label); setClasses(cl); await store.set("classes", cl); };

  /* learners */
  const addScanned = st => setStudents(list => [...list.filter(x => up(x.student_id) !== st.student_id), st]);
  const loadJson = () => {
    try {

  const rosterName = id => { if (!roster) return ""; const g = gender(id), k = idNum(id) - 1; const list = g === "B" ? roster.boys : g === "G" ? roster.girls : null; return list && list[k] ? list[k] : ""; };
  const data = useMemo(() => {

  const slot = config.slot || (config.examType === "term" ? "TE" : "ST1");

  const buildCSV = (withInitials = true) => {

    rows.push([], ["SUMMARY"], ["Total Learners", data.total], ["Boys", data.bStats.count], ["Girls", data.gStats.count],

      ["Class Mean", fmt(data.mean)], ["Standard Deviation", fmt(data.sd)], ["Class MPS (%)", fmt(data.mps)], ["Proficiency Level", proficiency(data.mps).label],
      ["Boys Mean", fmt(data.bStats.mean)], ["Boys MPS (%)", fmt(data.bStats.mps)], ["Girls Mean", fmt(data.gStats.mean)], ["Girls MPS (%)", fmt(data.gStats.mps)],
      ["Highest Score", data.high], ["Lowest Score", data.low]);
    data.comps.forEach(c => rows.push([`${c.label} MPS (%) (${c.count} items: ${c.items})`, fmt(c.mps)]));
    rows.push([], ["ITEM ANALYSIS"], ["Item", "Component", "Key", "Correct", "Frequency of Errors", "FOE %", "% Correct", "Remark"]);
    data.items.forEach(i => rows.push([i.no, compOf(i.no - 1), i.key, i.correct, i.wrong, fmt(i.foePct), fmt(i.pctCorrect), i.foePct > 50 ? "Critical Competency for Review" : i.pctCorrect >= 75 ? "Mastered" : "Least Mastered"]));
    return rows.map(r => r.map(q).join(",")).join("\r\n");

  const saveFile = async (text, filename, type) => {

  const copyText = async (t, msg) => { try { await navigator.clipboard.writeText(t); flash(msg); } catch (e) { flash("Copy blocked. Select the text and press Ctrl/Cmd+C."); } };
  const csvName = `jordynai_report_${subj.code}_${slot}_${term.replace(" ", "")}_${gradeSection.replace(/[^\w]+/g, "_")}.csv`;

  const summaryText =
`DEPED ${examLabel.toUpperCase()} SUMMARY (SMEA)
${profile.region} · ${profile.division}
${profile.school}
Grade & Section: ${gradeSection}
Term: ${term}
Exam: ${examLabel}
Subject / Learning Area: ${subj.label}
Number of Items: ${n}
Learners Tested: ${data.total} (Boys ${data.bStats.count}, Girls ${data.gStats.count})${roster ? ` of ${data.enrolled.length} enrolled` : ""}

Passing Mark: ${passMark}%   Passed: ${data.passed}   Failed: ${data.total - data.passed}   Passing Rate: ${fmt(data.passingRate)}%

Class Mean: ${fmt(data.mean)}
Standard Deviation: ${fmt(data.sd)}
Class MPS: ${fmt(data.mps)}%
Proficiency Level: ${proficiency(data.mps).label}
Boys Mean / MPS: ${fmt(data.bStats.mean)} / ${fmt(data.bStats.mps)}%
Girls Mean / MPS: ${fmt(data.gStats.mean)} / ${fmt(data.gStats.mps)}%
${data.comps.map(c => `${c.label} (${c.count} items: ${c.items}) Mean / MPS: ${fmt(c.mean)} / ${fmt(c.mps)}%`).join("\n")}${data.comps.length ? "\n" : ""}Highest Score: ${data.high}   Lowest Score: ${data.low}

Critical Competencies for Review (error rate above 50%): ${data.critical.length ? data.critical.map(i => `Q${i.no} (${fmt(i.foePct)}% wrong)`).join(", ") : "None"}
Least Mastered Items (below 75% correct): ${data.least.length ? data.least.map(i => `Q${i.no} (FOE ${i.wrong})`).join(", ") : "None"}
Mastered Items (75% correct and up): ${data.mastered.length ? data.mastered.map(i => "Q" + i.no).join(", ") : "None"}`;

  const finalize = async () => {
    const entry = {
      id: Date.now().toString(36), at: new Date().toISOString(), gradeSection, examType: config.examType, slot, term, subject: subj.label, itemCount: n,
      scores: Object.fromEntries(data.all.filter(x => gender(x.id) !== "?").map(x => [x.id, x.score])),
      learners: data.total, boys: data.bStats.count, girls: data.gStats.count, mean: data.mean, sd: data.sd, mps: data.mps,
      level: proficiency(data.mps).label, passingRate: data.passingRate, passMark, critical: data.critical.map(i => i.no),
      comps: data.comps.map(c => ({ label: c.label, mps: c.mps })), summary: summaryText, csv: buildCSV(false), csvName,

  const [exSel, setExSel] = useState({ cls: "", subject: "", term: "" });
  const exOptions = useMemo(() => {

  }, [history, exSel.cls]);
  const exData = useMemo(() => {

    if (!cls || !sub) return null;
    const pick = sl => history.filter(h => h.scores && h.gradeSection === cls && h.subject === sub && h.term === tm && h.slot === sl).sort((a, b) => b.at.localeCompare(a.at))[0] || null;
    const st1 = pick("ST1"), st2 = pick("ST2"), te = pick("TE");

    const ids = [...new Set([...enrolled, ...[st1, st2, te].filter(Boolean).flatMap(x => Object.keys(x.scores))])]
      .sort((a, b) => (gender(a) === gender(b) ? idNum(a) - idNum(b) : gender(a) === "B" ? -1 : 1));

  return (

          <div className="mt-8 pt-5 border-t border-red-500/30 text-center">
            <p className="text-xs text-red-300/80 mb-2">Danger zone: this erases your profile, classes, learner lists, answer key and History.</p>
            <button onClick={() => setModal("resetAll")} className="px-6 py-3 rounded-xl bg-red-600 hover:bg-red-500 text-white font-black tracking-wide shadow-[0_4px_0_#7f1d1d]">⚠️ RESET ALL DATA</button>
          </div>
        </Card>}
        </>}
      </div>

      {/* ===== MODALS ===== */}
      {modal === "profile" && <ProfileModal initial={profile} onSave={saveProfile} onClose={() => setModal(null)} />}
      {modal === "keyPrompt" && <Modal onClose={() => setModal(null)}>
        <div className="text-center"><div className="text-4xl mb-2">🔑</div>
          <h3 className="text-lg font-black text-white mb-2">Encode your answer keys in the Answer Key ({n}) tab</h3>
          <p className="text-sm text-slate-400 mb-4">Tap A, B, C or D for each item, then press <b>Save Answer Key</b>.</p>
          <button onClick={() => { setModal(null); setTab("setup"); setTimeout(() => keyRef.current && keyRef.current.scrollIntoView({ behavior: "smooth" }), 50); }} className="w-full py-2.5 rounded-xl bg-cyan-500 text-slate-950 font-bold">Encode Answer Keys</button></div>
      </Modal>}
      {modal === "copyPrompt" && <Modal onClose={() => setModal(null)}>
        <div className="text-center"><div className="text-4xl mb-2">📄</div>
          <h3 className="text-lg font-black text-white mb-2">Answer key saved! All tabs are unlocked.</h3>
          <p className="text-sm text-slate-400 mb-4">Press <b>Copy A/S</b> for your personalized DepEd answer sheets (4 per A4).</p>
          <div className="flex gap-2"><button onClick={() => setModal(null)} className="flex-1 py-2.5 rounded-xl bg-white/10">Later</button>
            <button onClick={() => setModal("copyAS")} className="flex-1 py-2.5 rounded-xl bg-amber-400 text-slate-950 font-bold">Copy A/S</button></div></div>
      </Modal>}
      {modal === "copyAS" && (() => {
        const o = { profile, n, subject: subj.label, exam: `${examLabel} · ${term}` };
        const dl = async kind => {
          try {
            setBlankBusy(kind);
            const pages = Math.max(1, Math.min(25, +blankPages || 1)); setBlankPages(pages);
            const name = `DepEd_Extra_Answer_Sheets_${n}items_${pages * 4}sheets`;
            if (kind === "pdf") { if (!window.jspdf) throw new Error("PDF tool not loaded"); await saveFile(sheetsPdf(o, blankList(pages)), name + ".pdf", "application/pdf"); }
            else { if (!window.docx) throw new Error("Word tool not loaded"); await saveFile(await sheetsDocx(o, blankList(pages)), name + ".docx", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"); }
          } catch (e) { flash("Couldn't make the file: " + (e.message || "try again")); }
          setBlankBusy("");
        };
        return (
          <Modal wide onClose={() => setModal(null)}>
            <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
              <h3 className="text-lg font-black text-white">📄 Extra Answer Sheets (blank) · {n} items</h3>
              <button onClick={() => setModal(null)} className="text-slate-400 text-xl">✕</button>
            </div>
            <p className="text-xs text-slate-400 mb-3">For <b>late enrollees</b> and <b>replacement sheets</b> when a learner spoils their own. Your region, division and school are printed; <b>Name, Grade &amp; Section, Date and CODE are left blank</b> to write by hand. Subject and exam come from the current settings ({subj.label} · {examLabel} · {term}).</p>
            <div className="grid md:grid-cols-[auto_1fr] gap-4 items-start">
              <div className="bg-slate-200 rounded-xl p-3 flex justify-center"><BlankPreview o={o} /></div>
              <div className="space-y-3">
                <label className="block"><Label>How many A4 pages? (4 sheets each)</Label>
                  <Input type="number" min="1" max="25" value={blankPages} onChange={e => setBlankPages(e.target.value)} onBlur={() => setBlankPages(Math.max(1, Math.min(25, +blankPages || 1)))} className="!w-28" />
                  <span className="text-xs text-slate-400"> = {Math.max(1, Math.min(25, +blankPages || 1)) * 4} sheets (max 25 pages)</span></label>
                <button disabled={!!blankBusy} onClick={() => dl("pdf")} className="w-full py-3 rounded-xl bg-red-500 hover:bg-red-400 text-white font-black disabled:opacity-40">{blankBusy === "pdf" ? "Making PDF…" : "⬇ Download PDF"}</button>
                <button disabled={!!blankBusy} onClick={() => dl("docx")} className="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-black disabled:opacity-40">{blankBusy === "docx" ? "Making Word file…" : "⬇ Download Microsoft Word (.docx)"}</button>
                <p className="text-[11px] text-slate-400">Print: A4 · Portrait · Scale 100% (Actual size) · no "fit to page". Cut on the dashed lines. Learners write their CODE (from your Code List) in the box so the scanner can match them.</p>
                <p className="text-[11px] text-slate-500">For the named sheets of a whole class, use "Add Students" → Download Answer Sheets in Class Setup.</p>
              </div>
            </div>
          </Modal>);
      })()}
      {modal === "finalize" && <Modal onClose={() => setModal(null)}>
        <h3 className="text-lg font-black text-white mb-2">Finalize this session?</h3>
        <p className="text-sm text-slate-300 mb-4">{gradeSection} · {subj.label} · {examLabel} · {data.total} learners · MPS {fmt(data.mps)}%. It will be saved to History with its summary and CSV.</p>
        <div className="flex gap-2"><button onClick={finalize} className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold">✔ Finalize</button>
          <button onClick={() => setModal(null)} className="flex-1 py-2.5 rounded-xl bg-white/10">Cancel</button></div>
      </Modal>}
      {modal === "resetAll" && <Modal>
        <div className="text-center">
          <div className="text-5xl mb-2">⚠️</div>
          <h3 className="text-xl font-black text-red-300 mb-2">Reset ALL data?</h3>
          <p className="text-sm text-slate-300 mb-1">This will <b>completely erase</b> everything you encoded and saved:</p>
          <p className="text-xs text-slate-400 mb-4">school profile · {classes.length} saved class(es) and their learner lists · answer key and exam settings · {history.length} finalized session(s) in History</p>
          <p className="text-xs text-amber-200 mb-4">This cannot be undone. Download the CSVs you need from History first.</p>
          <div className="flex gap-3">
            <button disabled={resetBusy} onClick={resetAll} className="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold disabled:opacity-50">{resetBusy ? "Erasing…" : "Yes, erase everything"}</button>
            <button disabled={resetBusy} onClick={() => { setModal(null); setTab("setup"); window.scrollTo({ top: 0, behavior: "smooth" }); }} className="flex-1 py-2.5 rounded-xl bg-white/10 font-bold">Cancel</button>
          </div>
        </div>
      </Modal>}
      {modal === "reset" && <Modal onClose={() => setModal(null)}>
        <h3 className="text-lg font-black text-white mb-2">Clear answers and key?</h3>
        <p className="text-sm text-slate-300 mb-4">This removes the loaded learner answers and resets the answer key so you can check another exam. Your profile, saved classes and History stay. Finalize first if you want to keep this result.</p>
        <div className="flex gap-2"><button onClick={resetExam} className="flex-1 py-2.5 rounded-xl bg-red-600 text-white font-bold">Clear</button>
          <button onClick={() => setModal(null)} className="flex-1 py-2.5 rounded-xl bg-white/10">Cancel</button></div>
      </Modal>}

      {toast && <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] bg-slate-800 border border-white/10 text-white text-sm px-4 py-2 rounded-lg shadow-lg">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Gate><App /></Gate>);

</script>
</body>
</html>
