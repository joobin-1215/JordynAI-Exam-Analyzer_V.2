            <h2 className="font-black text-white text-lg mb-3">🏷️ Class Setup</h2>
            <div className="grid md:grid-cols-[1fr_1fr_auto] gap-3 items-end">
              <label><Label>Grade</Label><Select value={grade} onChange={e => setGrade(e.target.value)}>{GRADES.map(g => <option key={g}>{g}</option>)}</Select></label>
              <label><Label>Section</Label><Input value={section} placeholder="e.g. WALING-WALING" onChange={e => setSection(up(e.target.value))} /></label>
              <button onClick={addClass} className="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/15 text-sm">+ Save class</button>
            </div>
            {classes.length > 0 && <div className="flex flex-wrap gap-2 mt-3">
              {classes.map(c => <span key={c} className={`flex items-center gap-1 text-xs rounded-full pl-3 pr-1 py-1 border ${c === `${grade} – ${section}` ? "bg-cyan-500/20 border-cyan-400 text-cyan-100" : "border-white/15 text-slate-300"}`}>
                <button onClick={() => pickClass(c)}>{c}</button>
                <button onClick={() => removeClass(c)} className="w-5 h-5 rounded-full hover:bg-white/10 text-slate-400">×</button></span>)}
            </div>}
            {classes.length > 0 && <div className="flex flex-wrap gap-2 mt-2">
              {classes.map(c => <button key={c} onClick={() => setRosterView(c)} className="text-[11px] px-2.5 py-1 rounded-lg bg-emerald-500/15 border border-emerald-400/40 text-emerald-200 hover:bg-emerald-500/25">
                👥 Add Students from {sectionOf(c)}{rosterCount(c) ? ` (${rosterCount(c)})` : ""}</button>)}
            </div>}
            <p className="text-xs text-slate-400 mt-3">Checking now: <b className="text-white">{gradeSection}</b> · {examLabel} · {subj.label} · {n} items · {students.length} learner(s) loaded{roster ? ` · ${roster.boys.filter(Boolean).length + roster.girls.filter(Boolean).length} enrolled in the student list` : " · no student list yet"}</p>
            <details className="mt-3">
              <summary className="text-xs text-cyan-300 cursor-pointer">Paste learner answers as JSON (optional, instead of scanning)</summary>
              <textarea value={rawText} onChange={e => setRawText(e.target.value)} spellCheck="false" placeholder='{"students":[{"student_id":"B-1","student_name":"Dela Cruz, Juan","responses":{"1":"A","2":"B"}}]}'
                className="mt-2 w-full min-h-[8rem] font-mono text-xs bg-slate-950/70 border border-white/10 rounded-lg p-2 text-slate-200" />
              {rawErr && <p className="text-xs text-red-400">JSON error: {rawErr}</p>}
              <button onClick={loadJson} className="mt-1 px-3 py-1.5 text-xs rounded-lg bg-cyan-500 text-slate-950 font-bold">Load JSON</button>
            </details>
          </Card>
          <SecurityCard flash={flash} saveFile={saveFile} />
        </>}

        {tab === "scan" && profile.configured && <>
          <ScanPanel onStudent={addScanned} onKey={onScannedKey} n={n} hasKey={keySaved} meta={imgMeta}
            queue={scanQueue} scannedIds={scannedIds} absent={absent} onAbsent={markAbsent} onUnabsent={unmarkAbsent}
            gradeSection={gradeSection} onReport={makeReport} />
          <Card><p className="text-sm text-slate-300">{students.length} learner(s) in <b>{gradeSection}</b>. {students.length > 0 && <button onClick={() => setTab("grades")} className="text-cyan-300 underline">See Gradesheet →</button>}</p></Card>
        </>}

        {tab === "grades" && unlocked && <div>
          <Card className="mb-4 !p-3"><div className="flex flex-wrap items-center gap-2 justify-between">
            <span className="text-xs text-slate-300">🗂️ Scanned sheets saved for this exam: <b>{imgKeys.filter(k => k !== "KEY").length}</b> (with the learner's written name). Saved on this device only.</span>
            <span className="flex flex-wrap gap-2">
              <button disabled={!!exporting} onClick={() => exportZip(imgPrefix, `${gradeSection}_${slot}_${term}`)} className="px-3 py-1.5 text-xs rounded-lg bg-emerald-500 text-slate-950 font-bold disabled:opacity-40">{exporting === "zip" ? "Zipping…" : "⬇ ZIP this exam"}</button>
              <button disabled={!!exporting} onClick={() => exportZip("", "all")} className="px-3 py-1.5 text-xs rounded-lg bg-white/10 disabled:opacity-40">⬇ ZIP everything</button>
              {"showDirectoryPicker" in window && <button disabled={!!exporting} onClick={() => exportFolder("")} className="px-3 py-1.5 text-xs rounded-lg bg-white/10 disabled:opacity-40">💾 Save into a folder (laptop)</button>}
            </span>
          </div></Card>
          <GradeTable title="BOYS" rows={data.boys} stats={data.bStats} tone="bg-blue-700/80" absentRows={data.absentIds.filter(id => gender(id) === "B")} />
          <GradeTable title="GIRLS" rows={data.girls} stats={data.gStats} tone="bg-pink-600/80" absentRows={data.absentIds.filter(id => gender(id) === "G")} />
          {data.absentIds.length > 0 && <p className="text-sm text-slate-300 bg-slate-500/10 p-3 rounded-lg mb-2">🚫 Absent ({data.absentIds.length}): {data.absentIds.map(id => `${id} ${toInitials(rosterName(id))}`).join(", ")} — no score, not counted in the mean, MPS or item analysis.</p>}
          {data.missing.length > 0 && <p className="text-sm text-sky-200 bg-sky-500/10 p-3 rounded-lg mb-2">📝 Enrolled but no sheet yet ({data.missing.length}): {data.missing.map(id => `${id} ${toInitials(rosterName(id))}`).join(", ")}</p>}
          {data.notEnrolled.length > 0 && <p className="text-sm text-amber-200 bg-amber-500/10 p-3 rounded-lg mb-2">⚠ Scanned IDs not in this section's student list: {data.notEnrolled.join(", ")}. Check the shaded Learner ID or update the list.</p>}
          {data.other.length > 0 && <p className="text-sm text-amber-200 bg-amber-500/10 p-3 rounded-lg">{data.other.length} learner(s) have IDs that don't start with B- or G- ({data.other.map(s => s.id).join(", ")}). Fix their IDs to sort them.</p>}
        </div>}

        {tab === "chart" && unlocked && <Card>
          <h3 className="font-black text-white mb-1">Frequency of Errors per Item</h3>
          <p className="text-xs text-slate-400 mb-2">Red = Critical Competency for Review (over 50% wrong) · Amber = least mastered (below 75% correct) · Green = mastered. Dashed line = 50%.</p>
          {data.critical.length > 0 && <div className="mb-3 bg-red-500/10 border border-red-400/40 text-red-200 text-sm rounded-lg p-3"><b>Critical Competency for Review:</b> {data.critical.map(i => `Q${i.no} (${fmt(i.foePct)}% wrong)`).join(", ")}</div>}
          <div className="relative flex items-end gap-1 h-64 border-b border-l border-white/20 px-1 overflow-x-auto">
            <div className="absolute left-0 right-0 border-t-2 border-dashed border-red-400/70 pointer-events-none" style={{ bottom: "42.5%" }}><span className="absolute right-1 -top-4 text-[10px] text-red-300">50% error</span></div>
            {data.items.map(i => (
              <div key={i.no} className="flex flex-col items-center justify-end h-full flex-1 min-w-[16px]" title={`Q${i.no}: ${i.wrong} wrong of ${data.total} (${fmt(i.foePct)}%) · key ${i.key}`}>
                <span className="text-[10px] text-slate-400 mb-0.5">{i.wrong}</span>
                <div className={`w-full rounded-t ${i.foePct > 50 ? "bg-red-500" : i.pctCorrect < 75 ? "bg-amber-400" : "bg-emerald-500"}`} style={{ height: `${data.total ? i.wrong / data.total * 85 : 0}%`, minHeight: i.wrong ? 3 : 0 }} />
              </div>))}
          </div>
          <div className="flex gap-1 px-1 overflow-x-auto">{data.items.map(i => <div key={i.no} className="flex-1 min-w-[16px] text-center text-[10px] text-slate-500">{i.no}</div>)}</div>
          <div className="overflow-x-auto mt-4"><table className="w-full text-sm">
            <thead className="bg-white/5 text-slate-300"><tr><th className="p-2">Item</th>{tags && <th className="p-2">Component</th>}<th className="p-2">Key</th><th className="p-2">Correct</th><th className="p-2">FOE</th><th className="p-2">FOE %</th><th className="p-2">% Correct</th><th className="p-2 text-left">Remark</th></tr></thead>
            <tbody>{data.items.map(i => <tr key={i.no} className="border-t border-white/5 text-center">
              <td className="p-2 font-bold">{i.no}</td>{tags && <td className="p-2"><span className={`text-[10px] font-bold text-white px-1.5 py-0.5 rounded ${COMP_STYLE[tags[i.no - 1]]}`}>{compOf(i.no - 1)}</span></td>}<td className="p-2 font-mono">{i.key}</td><td className="p-2">{i.correct}</td><td className="p-2 font-bold">{i.wrong}</td><td className="p-2">{fmt(i.foePct)}</td><td className="p-2">{fmt(i.pctCorrect)}</td>
              <td className="p-2 text-left">{i.foePct > 50 ? <span className="bg-red-600 text-white text-xs px-2 py-0.5 rounded font-bold">Critical Competency for Review</span> : i.pctCorrect >= 75 ? <span className="text-emerald-300">Mastered</span> : <span className="text-amber-300">Least Mastered</span>}</td></tr>)}</tbody>
          </table></div>
        </Card>}

        {tab === "summary" && unlocked && <Card>
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
            <h3 className="font-black text-white">🧾 DepEd Form Summary (SMEA)</h3>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => copyText(summaryText, "Summary copied.")} className="px-3 py-1.5 text-sm rounded-lg bg-white/10">Copy Summary</button>
              <button onClick={() => copyText(buildCSV(), "CSV copied.")} className="px-3 py-1.5 text-sm rounded-lg bg-white/10">Copy CSV</button>
              <button onClick={() => saveFile("﻿" + buildCSV(), csvName, "text/csv;charset=utf-8;")} className="px-3 py-1.5 text-sm rounded-lg bg-emerald-500 text-slate-950 font-bold">⬇ Download CSV</button>
              <button disabled={!data.total} onClick={() => setModal("finalize")} className="px-3 py-1.5 text-sm rounded-lg bg-cyan-500 text-slate-950 font-bold disabled:opacity-30">✅ Finalize Session</button>
            </div>
          </div>
          <pre className="whitespace-pre-wrap font-mono text-sm bg-slate-950/70 border border-white/10 rounded-lg p-4 select-all text-slate-200">{summaryText}</pre>
          <div className="overflow-x-auto"><table className="w-full text-sm mt-4">
            <thead className="bg-white/5 text-slate-300"><tr><th className="p-2 text-left">Group</th><th className="p-2">Learners</th><th className="p-2">Mean</th><th className="p-2">MPS</th><th className="p-2">SD</th><th className="p-2 text-left">Proficiency</th></tr></thead>
            <tbody>{[["Boys", data.bStats], ["Girls", data.gStats], ["Total", { count: data.total, mean: data.mean, mps: data.mps, sd: data.sd }]].map(([g, s]) =>
              <tr key={g} className={`border-t border-white/5 text-center ${g === "Total" ? "font-bold bg-white/5" : ""}`}><td className="p-2 text-left">{g}</td><td className="p-2">{s.count}</td><td className="p-2">{fmt(s.mean)}</td><td className="p-2">{fmt(s.mps)}%</td><td className="p-2">{fmt(s.sd)}</td><td className="p-2 text-left"><Badge pct={s.mps} /></td></tr>)}</tbody>
          </table></div>
          {data.comps.length > 0 && <div className="overflow-x-auto"><table className="w-full text-sm mt-4">
            <thead className="bg-white/5 text-slate-300"><tr><th className="p-2 text-left">Component</th><th className="p-2">Items</th><th className="p-2">Mean</th><th className="p-2">MPS</th><th className="p-2 text-left">Proficiency</th></tr></thead>
            <tbody>{data.comps.map(c => <tr key={c.label} className="border-t border-white/5 text-center"><td className="p-2 text-left font-bold">{c.label}</td><td className="p-2 text-xs font-mono">{c.count}: {c.items}</td><td className="p-2">{fmt(c.mean)} / {c.count}</td><td className="p-2">{fmt(c.mps)}%</td><td className="p-2 text-left"><Badge pct={c.mps} /></td></tr>)}</tbody>
          </table></div>}
          <p className="text-[11px] text-slate-500 mt-3">Levels: 96–100 Mastered · 86–95 Closely Approximating · 66–85 Moving Towards · 35–65 Average · 15–34 Low · 5–14 Very Low · 0–4 Absolutely No Mastery.</p>
          <div className="mt-4 text-right"><button onClick={() => setModal("reset")} className="text-xs text-red-300 underline">Clear answers &amp; key for a new exam</button></div>
        </Card>}

        {tab === "history" && unlocked && <Card>
          {exData && <div className="mb-6 rounded-2xl border border-cyan-400/30 bg-cyan-500/5 p-3">
            <h3 className="font-black text-white mb-1">📘 Exams Component (ST1 + ST2 + TE)</h3>
            <p className="text-xs text-slate-400 mb-2">Uses the latest finalized ST1, ST2 and TE of the same class, subject and term. <b>A</b> = add the raw points (for example 25 + 25 + 50 = 100). <b>B</b> = DO 15, s. 2026 weights: ST1 30% + ST2 30% + TE 40% of each test's percentage. Pick the one your school requires for the class record.</p>
            <div className="grid sm:grid-cols-3 gap-2 mb-3">
              <Select value={exData.cls} onChange={e => setExSel({ cls: e.target.value, subject: "", term: exSel.term })}>{exOptions.cls.map(c => <option key={c}>{c}</option>)}</Select>
              <Select value={exData.sub} onChange={e => setExSel({ ...exSel, cls: exData.cls, subject: e.target.value })}>{exOptions.subs.map(c => <option key={c}>{c}</option>)}</Select>
              <Select value={exData.tm} onChange={e => setExSel({ ...exSel, cls: exData.cls, term: e.target.value })}>{exOptions.terms.map(c => <option key={c}>{c}</option>)}</Select>
            </div>
            <p className="text-xs text-slate-300 mb-2">{[["ST1", exData.st1], ["ST2", exData.st2], ["TE", exData.te]].map(([k, x]) => `${k}: ${x ? `${x.itemCount} items ✔` : "not finalized yet"}`).join(" · ")}</p>
            <div className="overflow-x-auto max-h-96"><table className="w-full text-sm">
              <thead className="bg-white/5 text-slate-300 sticky top-0"><tr><th className="p-2 text-left">Code</th><th className="p-2 text-left">Initials</th><th className="p-2">ST1</th><th className="p-2">ST2</th><th className="p-2">TE</th><th className="p-2">A: Points %</th><th className="p-2">B: 30/30/40 %</th></tr></thead>
              <tbody>{exData.rows.map(r => <tr key={r.id} className="border-t border-white/5 text-center">
                <td className="p-2 text-left font-mono font-bold text-cyan-200">{r.id}</td><td className="p-2 text-left">{r.initials}</td>
                <td className="p-2">{r.a ?? "—"}</td><td className="p-2">{r.b ?? "—"}</td><td className="p-2">{r.c ?? "—"}</td>
                <td className="p-2 font-bold">{r.points != null ? fmt(r.points) : <span className="text-slate-500 text-xs">incomplete</span>}</td>
                <td className="p-2 font-bold">{r.weighted != null ? fmt(r.weighted) : <span className="text-slate-500 text-xs">incomplete</span>}</td></tr>)}</tbody>
            </table></div>
            <div className="flex gap-2 mt-2"><button onClick={() => saveFile(exCSV(), `Exams_Component_${exData.cls.replace(/[^\w]+/g, "_")}_${exData.sub.replace(/[^\w]+/g, "_")}_${exData.tm.replace(" ", "")}.csv`, "text/csv;charset=utf-8;")} className="px-3 py-1.5 text-xs rounded-lg bg-emerald-500 text-slate-950 font-bold">⬇ Download Exams Component CSV</button>
              <button onClick={() => copyText(exCSV(), "Exams Component copied.")} className="px-3 py-1.5 text-xs rounded-lg bg-white/10">Copy</button></div>
            <p className="text-[11px] text-slate-500 mt-1">"incomplete" = the learner is missing one of the three tests. Initials come from the learner list on this device.</p>
          </div>}
          <h3 className="font-black text-white mb-1">🗂️ Finalized Sessions</h3>
          <p className="text-xs text-slate-400 mb-3">{saveMode}.</p>
          {history.length === 0 ? <p className="text-sm text-slate-500">No finalized sessions yet. Finalize one from the Summary tab.</p> :
            <div className="space-y-2">{history.map(h => (
              <div key={h.id} className="bg-slate-900/60 border border-white/10 rounded-xl p-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <p className="font-bold text-white">{h.gradeSection} · {h.subject} · {h.slot ? `${h.slot} · ${h.term}` : (h.examType === "summative" ? "Summative" : "Term")} ({h.itemCount} items)</p>
                    <p className="text-xs text-slate-400">{new Date(h.at).toLocaleString("en-PH", { dateStyle: "medium", timeStyle: "short" })} · {h.learners} learners · MPS {fmt(h.mps)}% · Passing rate {fmt(h.passingRate)}%</p>
                  </div>
                  <div className="flex items-center gap-2"><Badge pct={h.mps} />
                    <button onClick={() => setOpenHist(openHist === h.id ? null : h.id)} className="text-xs px-2 py-1 rounded bg-white/10">{openHist === h.id ? "Hide" : "View"}</button>
                    <button onClick={() => saveFile("﻿" + h.csv, h.csvName, "text/csv;charset=utf-8;")} className="text-xs px-2 py-1 rounded bg-emerald-500/20 text-emerald-200">CSV</button>
                    <button onClick={() => { if (openHist === "del" + h.id) deleteHist(h.id); else setOpenHist("del" + h.id); }} className="text-xs px-2 py-1 rounded bg-red-500/20 text-red-200">{openHist === "del" + h.id ? "Tap again to delete" : "Delete"}</button>
                  </div>
                </div>
                {openHist === h.id && <div className="mt-2">
                  <pre className="whitespace-pre-wrap font-mono text-xs bg-slate-950/70 rounded-lg p-3 text-slate-300">{h.summary}</pre>
                  <button onClick={() => copyText(h.summary, "Summary copied.")} className="mt-1 text-xs px-2 py-1 rounded bg-white/10">Copy Summary</button>
                </div>}
              </div>))}</div>}
          <div className="mt-8 pt-5 border-t border-red-500/30 text-center">
            <p className="text-xs text-red-300/80 mb-2">Danger zone: this erases your profile, classes, learner lists, answer key and History.</p>
            <button onClick={() => { setHumanOk(""); setModal("resetAll"); }} className="px-6 py-3 rounded-xl bg-red-600 hover:bg-red-500 text-white font-black tracking-wide shadow-[0_4px_0_#7f1d1d]">⚠️ RESET ALL DATA</button>
          </div>
        </Card>}
        </>}
      </div>

      {/* ===== MODALS ===== */}
      {modal === "profile" && !profile.configured && Sync.available() && !Sync.isOn() && Acct.id && <SyncJoinBanner />}
      {modal === "profile" && <ProfileModal initial={profile} onSave={saveProfile} onClose={() => setModal(null)} />}
      {modal === "keyPrompt" && <Modal onClose={() => setModal(null)}>
        <div className="text-center"><div className="text-4xl mb-2">🔑</div>
          <h3 className="text-lg font-black text-white mb-2">Encode your answer keys in the Answer Key ({n}) tab</h3>
          <p className="text-sm text-slate-400 mb-4">Tap A, B, C or D for each item, then press <b>Save Answer Key</b>.</p>
          <button onClick={() => { setModal(null); setTab("setup"); setTimeout(() => keyRef.current && keyRef.current.scrollIntoView({ behavior: "smooth" }), 50); }} className="w-full py-2.5 rounded-xl bg-cyan-500 text-slate-950 font-bold">Encode Answer Keys</button></div>
      </Modal>}
      {modal === "copyPrompt" && <Modal onClose={() => setModal(null)}>
        <div className="text-center"><div className="text-4xl mb-2">📄</div>
          <h3 className="text-lg font-black text-white mb-2">Answer key saved! All tabs are unlocked.</h3>
          <p className="text-sm text-slate-400 mb-4">Press <b>Copy A/S</b> for your personalized DepEd answer sheets (4 per A4).</p>
          <div className="flex gap-2"><button onClick={() => setModal(null)} className="flex-1 py-2.5 rounded-xl bg-white/10">Later</button>
            <button onClick={() => setModal("copyAS")} className="flex-1 py-2.5 rounded-xl bg-amber-400 text-slate-950 font-bold">Copy A/S</button></div></div>
      </Modal>}
      {modal === "copyAS" && (() => {
        const o = { profile, n, subject: subj.label, exam: `${examLabel} · ${term}` };
        const dl = async kind => {
          try {
            setBlankBusy(kind);
            const pages = Math.max(1, Math.min(25, +blankPages || 1)); setBlankPages(pages);
            const name = `DepEd_Extra_Answer_Sheets_${n}items_${pages * 4}sheets`;
            if (kind === "pdf") { if (!window.jspdf) throw new Error("PDF tool not loaded"); await saveFile(sheetsPdf(o, blankList(pages)), name + ".pdf", "application/pdf"); }
            else { if (!window.docx) throw new Error("Word tool not loaded"); await saveFile(await sheetsDocx(o, blankList(pages)), name + ".docx", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"); }
          } catch (e) { flash("Couldn't make the file: " + (e.message || "try again")); }
          setBlankBusy("");
        };
        return (
          <Modal wide onClose={() => setModal(null)}>
            <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
              <h3 className="text-lg font-black text-white">📄 Extra Answer Sheets (blank) · {n} items</h3>
              <button onClick={() => setModal(null)} className="text-slate-400 text-xl">✕</button>
            </div>
            <p className="text-xs text-slate-400 mb-3">For <b>late enrollees</b> and <b>replacement sheets</b> when a learner spoils their own. Your region, division and school are printed; <b>Name, Grade &amp; Section, Date and CODE are left blank</b> to write by hand. Subject and exam come from the current settings ({subj.label} · {examLabel} · {term}).</p>
            <div className="grid md:grid-cols-[auto_1fr] gap-4 items-start">
              <div className="bg-slate-200 rounded-xl p-3 flex justify-center"><BlankPreview o={o} /></div>
              <div className="space-y-3">
                <label className="block"><Label>How many A4 pages? (4 sheets each)</Label>
                  <Input type="number" min="1" max="25" value={blankPages} onChange={e => setBlankPages(e.target.value)} onBlur={() => setBlankPages(Math.max(1, Math.min(25, +blankPages || 1)))} className="!w-28" />
                  <span className="text-xs text-slate-400"> = {Math.max(1, Math.min(25, +blankPages || 1)) * 4} sheets (max 25 pages)</span></label>
                <button disabled={!!blankBusy} onClick={() => dl("pdf")} className="w-full py-3 rounded-xl bg-red-500 hover:bg-red-400 text-white font-black disabled:opacity-40">{blankBusy === "pdf" ? "Making PDF…" : "⬇ Download PDF"}</button>
                <button disabled={!!blankBusy} onClick={() => dl("docx")} className="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-black disabled:opacity-40">{blankBusy === "docx" ? "Making Word file…" : "⬇ Download Microsoft Word (.docx)"}</button>
                <p className="text-[11px] text-slate-400">Print: A4 · Portrait · Scale 100% (Actual size) · no "fit to page". Cut on the dashed lines. Learners write their CODE (from your Code List) in the box so the scanner can match them.</p>
                <p className="text-[11px] text-slate-500">For the named sheets of a whole class, use "Add Students" → Download Answer Sheets in Class Setup.</p>
              </div>
            </div>
          </Modal>);
      })()}
      {modal === "finalize" && <Modal onClose={() => setModal(null)}>
        <h3 className="text-lg font-black text-white mb-2">Finalize this session?</h3>
        <p className="text-sm text-slate-300 mb-4">{gradeSection} · {subj.label} · {examLabel} · {data.total} learners · MPS {fmt(data.mps)}%. It will be saved to History with its summary and CSV.</p>
        <div className="flex gap-2"><button onClick={finalize} className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold">✔ Finalize</button>
          <button onClick={() => setModal(null)} className="flex-1 py-2.5 rounded-xl bg-white/10">Cancel</button></div>
      </Modal>}
      {viewImg && <Modal wide onClose={() => { [viewImg.sheetUrl, viewImg.nameUrl].forEach(u => u && URL.revokeObjectURL(u)); setViewImg(null); }}>
        <div className="flex items-center justify-between mb-2"><h3 className="font-black text-white">🖼️ {viewImg.code} · {rosterName(viewImg.code) ? toInitials(rosterName(viewImg.code)) : ""} · {examLabel}</h3>
          <button onClick={() => { [viewImg.sheetUrl, viewImg.nameUrl].forEach(u => u && URL.revokeObjectURL(u)); setViewImg(null); }} className="text-slate-400 text-xl">✕</button></div>
        {viewImg.nameUrl && <><p className="text-xs text-slate-400 mb-1">Written name:</p><img src={viewImg.nameUrl} alt="name" className="w-full max-w-lg bg-white rounded mb-3" /></>}
        {viewImg.sheetUrl && <img src={viewImg.sheetUrl} alt="sheet" className="w-full max-w-md mx-auto bg-white rounded" />}
      </Modal>}
      {modal === "resetAll" && <Modal>
        <div className="text-center">
          <div className="text-5xl mb-2">⚠️</div>
          <h3 className="text-xl font-black text-red-300 mb-2">Reset ALL data?</h3>
          <p className="text-sm text-slate-300 mb-1">This will <b>completely erase</b> everything you encoded and saved:</p>
          <p className="text-xs text-slate-400 mb-4">school profile · {classes.length} saved class(es) and their learner lists · answer key and exam settings · {history.length} finalized session(s) in History</p>
          <p className="text-xs text-amber-200 mb-1">This cannot be undone. Download the CSVs you need from History first.</p>
          {!store.db && Acct.hint && <p className="text-xs text-slate-400">Only <b>{Acct.hint}</b> on this device is erased. Other emails stay.</p>}
          {!store.db && Sync.isOn() && <label className="flex items-start gap-2 text-xs text-slate-200 my-2"><input type="checkbox" checked={wipeCloud} onChange={e => setWipeCloud(e.target.checked)} className="mt-0.5" /><span><b>Also erase the synced copy in Google Drive.</b> Your other devices will be emptied too the next time they sync. Leave unticked to erase only this device (sync turns off here).</span></label>}
          {!store.db && <HumanCheck onPass={setHumanOk} />}
          <div className="flex gap-3">
            <button disabled={resetBusy || (!store.db && !humanOk)} onClick={resetAll} className="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold disabled:opacity-50">{resetBusy ? "Erasing…" : "Yes, erase everything"}</button>
            <button disabled={resetBusy} onClick={() => { setModal(null); setTab("setup"); window.scrollTo({ top: 0, behavior: "smooth" }); }} className="flex-1 py-2.5 rounded-xl bg-white/10 font-bold">Cancel</button>
          </div>
        </div>
      </Modal>}
      {modal === "reset" && <Modal onClose={() => setModal(null)}>
        <h3 className="text-lg font-black text-white mb-2">Clear answers and key?</h3>
        <p className="text-sm text-slate-300 mb-4">This removes the loaded learner answers and resets the answer key so you can check another exam. Your profile, saved classes and History stay. Finalize first if you want to keep this result.</p>
        <div className="flex gap-2"><button onClick={resetExam} className="flex-1 py-2.5 rounded-xl bg-red-600 text-white font-bold">Clear</button>
          <button onClick={() => setModal(null)} className="flex-1 py-2.5 rounded-xl bg-white/10">Cancel</button></div>
      </Modal>}

      {toast && <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] bg-slate-800 border border-white/10 text-white text-sm px-4 py-2 rounded-lg shadow-lg">{toast}</div>}
      {genLoading && <div className="fixed inset-0 z-[300] bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center">
        <div className="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin" />
        <p className="mt-4 text-lg font-black text-white">Generating report…</p>
        <p className="text-sm text-slate-400">{gradeSection} · individual learner and class statistics</p>
        <div className="w-56 h-1.5 bg-white/10 rounded-full overflow-hidden mt-4"><div className="h-full bg-cyan-400 rounded-full animate-[genbar_1.8s_linear_forwards]" /></div>
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Gate><App /></Gate>);

</script>
</body>
</html>
