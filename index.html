};
const COMP_STYLE = ["bg-violet-500", "bg-pink-500", "bg-emerald-500", "bg-sky-500"];
/* Default component blocks: earlier components get the smaller share (12 + 13, or 12 + 13 + 12 + 13 for 50). */
function defaultTags(n, comps) {
  if (!comps) return null;
  const k = comps.length, base = Math.floor(n / k);
  let extra = n - base * k;
  const sizes = comps.map(() => base);
  for (let i = k - 1; i >= 0 && extra > 0; i -= 2) { sizes[i]++; extra--; }
  for (let i = k - 2; i >= 0 && extra > 0; i -= 2) { sizes[i]++; extra--; }
  const tags = []; sizes.forEach((sz, ci) => { for (let j = 0; j < sz; j++) tags.push(ci); });
  return tags;
}
/* "1,3,6-8" -> [1,3,6,7,8] */
function parseItems(text, n) {
  const out = new Set();
  String(text || "").split(/[,\s]+/).filter(Boolean).forEach(part => {
    const m = part.match(/^(\d+)(?:-(\d+))?$/); if (!m) return;
    const a = +m[1], b = m[2] ? +m[2] : a;
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) if (i >= 1 && i <= n) out.add(i);
  });
  return [...out].sort((x, y) => x - y);
}
const listItems = arr => { const out = []; let i = 0; while (i < arr.length) { let j = i; while (j + 1 < arr.length && arr[j + 1] === arr[j] + 1) j++; out.push(j > i ? `${arr[i]}-${arr[j]}` : `${arr[i]}`); i = j + 1; } return out.join(", "); };

/* ===================== HELPERS ===================== */
function toInitials(full) {
  const str = String(full || "").trim();

  return [...letters(first), ...letters(last)].map(c => c + ".").join("");

const sdOf = arr => { if (!arr.length) return 0; const m = arr.reduce((t, s) => t + s.score, 0) / arr.length; return Math.sqrt(arr.reduce((t, s) => t + (s.score - m) ** 2, 0) / arr.length); };

/* ===================== SHEET LAYOUT ===================== */
/* Pick the column count that gives the biggest bubbles for this many items. All sizes in mm. */
function sheetLayout(n) {
  const AVAIL_H = 87, WIDTH = 93, GAP = 1.6;
  let best = null;
  for (let cols = 1; cols <= 4; cols++) {
    const rows = Math.ceil(n / cols);
    const rowH = Math.min(13, AVAIL_H / rows);
    const colW = (WIDTH - GAP * (cols - 1)) / cols;
    const b = Math.min(rowH * 0.62, ((colW - 6) / 4) * 0.8, 7);
    if (!best || b > best.b + 0.05 || (Math.abs(b - best.b) <= 0.05 && rowH > best.rowH)) best = { cols, rows, rowH, colW, b };
  }
  best.gap = Math.max(0.8, Math.min(2.2, ((best.colW - 6) / 4) - best.b));

}

const GEO = {

};
/* Dot code, 9 cells: [start=1, isGirl, isKey, n5 n4 n3 n2 n1 n0] -> B-1..B-63, G-1..G-63, KEY */
function codeToBits(code) {
  const c = up(code).replace(/\s/g, "");
  if (c === "KEY") return [1, 0, 1, 0, 0, 0, 0, 0, 0];
  const m = c.match(/^([BG])-?(\d{1,2})$/); if (!m) return null;
  const n = +m[2]; if (n < 1 || n > 63) return null;
  return [1, m[1] === "G" ? 1 : 0, 0, ...[5, 4, 3, 2, 1, 0].map(b => (n >> b) & 1)];
}
function bitsToCode(bits) {
  if (!bits || bits[0] !== 1) return null;
  if (bits[2]) return bits[1] || bits.slice(3).some(Boolean) ? null : "KEY";
  const n = bits.slice(3).reduce((t, b) => t * 2 + b, 0);
  return n >= 1 ? `${bits[1] ? "G" : "B"}-${n}` : null;

/* Where each bubble's center is (mm, sheet-local). */
function bubbleCenters(n) {
  const L = sheetLayout(n), noW = Math.max(4.4, L.b * 1.3), out = [];
  for (let q = 1; q <= n; q++) {
    const c = Math.floor((q - 1) / L.rows), r = (q - 1) % L.rows;
    const cx = GEO.itemsLeft + c * (L.colW + GEO.colGap);
    const cy = GEO.itemsTop + 3.4 + r * L.rowH + L.rowH / 2;
    out.push([0, 1, 2, 3].map(k => [cx + noW + L.b / 2 + k * (L.b + L.gap), cy]));
  }
  return { L, noW, centers: out };
}

const safeName = s => String(s).replace(/[\u2013\u2014]/g, "-").replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim();
/* every saved image as { path, blob }: JordynAI Answer Sheets/<Grade – Section>/<Term> <Exam> <Subject>/<code>.jpg + <code>_name.jpg */
async function allSheetFiles(prefix = "") {
  const out = [];
  for (const k of await imgStore.keys(prefix)) {
    const it = await imgStore.get(k); if (!it || !it.sheet) continue;
    const m = it.meta, dir = ["JordynAI Answer Sheets", safeName(m.gradeSection), safeName(`${m.term} ${m.slot} ${m.subject}`)];
    out.push({ dir, file: `${safeName(m.code)}.jpg`, blob: it.sheet });
    if (it.name) out.push({ dir, file: `${safeName(m.code)}_name.jpg`, blob: it.name });
  }

}
async function sheetsZip(prefix) {
  const files = await allSheetFiles(prefix); if (!files.length) return null;
  const zip = new window.JSZip();
  files.forEach(f => zip.file([...f.dir, f.file].join("/"), f.blob));
  return zip.generateAsync({ type: "blob", compression: "STORE" });
}
async function sheetsToFolder(prefix) {
  if (!window.showDirectoryPicker) throw new Error("unsupported");
  const files = await allSheetFiles(prefix); if (!files.length) return 0;
  const root = await window.showDirectoryPicker({ mode: "readwrite" });
  for (const f of files) {
    let d = root; for (const part of f.dir) d = await d.getDirectoryHandle(part, { create: true });
    const fh = await d.getFileHandle(f.file, { create: true }), w = await fh.createWritable(); await w.write(f.blob); await w.close();
  }

}

/* ===================== STORAGE (Claude db, else this browser) ===================== */
const store = {
  db: null, uid: null, ready: false,
  async init() {
    if (this.ready) return;
    try {
      const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
      const user = window.claude && window.claude.use ? await window.claude.use("user") : null;
      if (db && user) { this.uid = await user.id(); this.db = db; }
    } catch (e) { this.db = null; }
    this.ready = true;
  },
  ref(k) { return this.db.collection("data/users/" + this.uid).doc(k); },
  async get(k, fallback) {
    try {
      if (this.db) {
        const snap = await this.ref(k).get();
        const d = snap && (typeof snap.data === "function" ? snap.data() : snap.data !== undefined ? snap.data : snap);
        if (d && typeof d.v === "string") { const v = JSON.parse(d.v); return v == null ? fallback : v; }
        return fallback;
      }
      if (Vault.isOpen()) return Vault.get("jordynai_" + k, fallback);
      const raw = localStorage.getItem("jordynai_" + k);
      const v = raw ? JSON.parse(raw) : null; return v == null ? fallback : v;

  },
  async set(k, value) {
    try {
      if (this.db) { await this.ref(k).set({ v: JSON.stringify(value), at: Date.now() }); return true; }
      if (Vault.isOpen()) return Vault.set("jordynai_" + k, value);
      localStorage.setItem("jordynai_" + k, JSON.stringify(value)); return true;
    } catch (e) { return false; }
  },
};

/* ===================== SCANNER ===================== */
const scanPrompt = n => `You are reading ONE photo of a printed DepEd OMR answer sheet (a quarter of an A4 page, portrait, 105 x 148.5 mm).
Layout: four black corner squares and a school header. Top right is a box labeled "CODE" with a printed or handwritten learner code such as B-1, B-12, G-3 (B = boy, G = girl), or the words "ANSWER KEY" (the teacher's key sheet). Beside it are printed lines: Exam, Grade & Section, Subject.

Older sheets may instead have a "LEARNER ID" bubble box (TYPE: BOY/GIRL/KEY, TENS 0-5, ONES 0-9); if so, build the code from it (BOY + 0 + 7 = B-7).
If the code box is empty, read a handwritten code if any.\nPrivacy rule: do NOT read, copy or report any person's name, even if one is written on the sheet.
If the photo shows more than one sheet, read ONLY the sheet that is most complete and centered, and say so in "note".

Read only what is SHADED (filled dark). Rules:
- An item with no shaded bubble -> null.
- An item with two or more shaded bubbles, or a light/unclear mark -> null, and add the item number to "flagged".
- Never guess an answer from context.
Reply with ONLY this JSON:
{"code":"B-12"|"G-3"|"KEY"|null,"answers":{"1":"A"|"B"|"C"|"D"|null, ... through "${n}"},"flagged":[item numbers],"note":"short note if the photo is blurry, cut off or not an answer sheet, else empty"}`;

/* ===================== SHEET ALIGNER (frame = answer sheet shape 105 x 148.5 mm) ===================== */
const SHEET_RATIO = 148.5 / 105;            // 1 : 1.414, same as one quarter-sheet
const OUT_W = 1050, OUT_H = 1485;           // 10 px per mm crop sent to Claude
function frameSize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const maxW = Math.min(vw * 0.92, 560);    // phones: almost full width; tablets: capped so it stays easy to see
  const maxH = vh * 0.66;                   // leave room for the buttons
  const w = Math.max(220, Math.min(maxW, maxH / SHEET_RATIO));
  return { w: Math.round(w), h: Math.round(w * SHEET_RATIO) };
}


/* Find the sheet's 4 black corner squares in a photo. Returns their centers in image pixels, or null. */
function findCorners(img) {
  const M = 520, k = M / Math.max(img.naturalWidth, img.naturalHeight);
  const W = Math.round(img.naturalWidth * k), H = Math.round(img.naturalHeight * k);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, W, H);
  const px = ctx.getImageData(0, 0, W, H).data;
  let sum = 0; const g = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) { g[i] = (px[i * 4] * 0.3 + px[i * 4 + 1] * 0.59 + px[i * 4 + 2] * 0.11) | 0; sum += g[i]; }
  const thr = Math.min(90, (sum / (W * H)) * 0.45);
  const seen = new Uint8Array(W * H), blobs = [];
  for (let i = 0; i < W * H; i++) {
    if (seen[i] || g[i] > thr) continue;
    let minx = W, maxx = 0, miny = H, maxy = 0, n = 0, sx = 0, sy = 0; const st = [i]; seen[i] = 1;
    while (st.length) {
      const j = st.pop(), x = j % W, y = (j / W) | 0; n++; sx += x; sy += y;
      if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
      for (const q of [j - 1, j + 1, j - W, j + W]) if (q >= 0 && q < W * H && !seen[q] && g[q] <= thr && Math.abs((q % W) - x) <= 1) { seen[q] = 1; st.push(q); }
    }
    const bw = maxx - minx + 1, bh = maxy - miny + 1, area = W * H;
    if (n > area * 0.00015 && n < area * 0.02 && bw / bh > 0.6 && bw / bh < 1.6 && n / (bw * bh) > 0.65) blobs.push({ x: sx / n, y: sy / n, n });
  }
  if (blobs.length < 4) return null;
  const pickBy = f => blobs.reduce((a, b) => (f(b) > f(a) ? b : a));
  const tl = pickBy(b => -(b.x + b.y)), br = pickBy(b => b.x + b.y), tr = pickBy(b => b.x - b.y), bl = pickBy(b => b.y - b.x);
  const pts = [tl, tr, bl, br];
  if (new Set(pts).size < 4) return null;
  const wTop = Math.hypot(tr.x - tl.x, tr.y - tl.y), hLeft = Math.hypot(bl.x - tl.x, bl.y - tl.y);
  const ratio = hLeft / wTop;                     // corner-to-corner: (148.5-13)/(105-13) ≈ 1.47
  if (ratio < 1.25 || ratio > 1.75 || wTop < W * 0.15) return null;
  return pts.map(p => ({ x: p.x / k, y: p.y / k }));
}
/* Best-fit move + turn + zoom (similarity) that puts the 4 corners on the 4 guide squares. */
function fitCorners(img, corners, box) {
  const g = box.w * (5 / 105), inset = box.w * (4 / 105), c0 = inset + g / 2;
  const targets = [[c0, c0], [box.w - c0, c0], [c0, box.h - c0], [box.w - c0, box.h - c0]].map(([x, y]) => [x - box.w / 2, y - box.h / 2]);
  const src = corners.map(p => [p.x - img.naturalWidth / 2, p.y - img.naturalHeight / 2]);
  const ms = [0, 1].map(d => src.reduce((t, p) => t + p[d], 0) / 4), mt = [0, 1].map(d => targets.reduce((t, p) => t + p[d], 0) / 4);
  let num1 = 0, num2 = 0, den = 0;
  src.forEach((p, i) => { const qx = p[0] - ms[0], qy = p[1] - ms[1], X = targets[i][0] - mt[0], Y = targets[i][1] - mt[1]; num1 += qx * X + qy * Y; num2 += qx * Y - qy * X; den += qx * qx + qy * qy; });
  const a = num1 / den, b = num2 / den;
  return { s: Math.hypot(a, b), rot: Math.atan2(b, a) * 180 / Math.PI, tx: mt[0] - (a * ms[0] - b * ms[1]), ty: mt[1] - (b * ms[0] + a * ms[1]) };
}

function SheetAligner({ file, index, total, onDone, onSkip, onCancel }) {
  useEffect(() => { window.__jordynBusy = (window.__jordynBusy || 0) + 1; return () => { window.__jordynBusy = Math.max(0, (window.__jordynBusy || 1) - 1); }; }, []);   // random human check waits while scanning

  const ptrs = useRef(new Map());
  const pinch = useRef(null);
  const [auto, setAuto] = useState(null);   // "found" | "notfound"
  const autoAlign = (im, b = box) => { try { const cs = findCorners(im); if (cs) { const f = fitCorners(im, cs, b); const base = fit(im, 0, b).base; setV({ ...f, base }); setAuto("found"); return true; } } catch (e) {} setAuto("notfound"); return false; };

    const iw = rot % 180 ? im.naturalHeight : im.naturalWidth, ih = rot % 180 ? im.naturalWidth : im.naturalHeight;
    const base = Math.max(b.w / iw, b.h / ih);   // cover the frame

  };

    ptrs.current.set(e.pointerId, { x: nx, y: ny });

  };

    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, OUT_W, OUT_H);
    const k = OUT_W / box.w;
    ctx.translate(OUT_W / 2 + v.tx * k, OUT_H / 2 + v.ty * k); ctx.rotate(v.rot * Math.PI / 180); ctx.scale(v.s * k, v.s * k);
    ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);

  };

  const g = box.w * (5 / 105), inset = box.w * (4 / 105);
  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[70] bg-slate-950/95 flex flex-col items-center justify-start overflow-y-auto p-3 select-none">
      <div className="w-full max-w-xl flex items-center justify-between text-sm text-slate-200 mb-2">
        <span>Align sheet {index + 1} of {total}</span>
        <button onClick={onCancel} className="text-slate-400">✕ Cancel</button>
      </div>
      {auto === "found" && <p className="text-xs text-emerald-300 mb-1 text-center">✔ Corners found automatically. Check that the 4 black corners sit on the guides, then tap Use this sheet.</p>}
      {auto === "notfound" && <p className="text-xs text-amber-300 mb-1 text-center">Couldn't find the 4 corners automatically. Align by hand (or retake with all 4 corners visible).</p>}
      <p className="text-xs text-cyan-200 mb-2 text-center max-w-xl">Drag to move · pinch (or scroll) to zoom · put the sheet's <b>4 black corners</b> on the 4 white guide squares.</p>
      <div className="relative overflow-hidden rounded-lg bg-black touch-none shadow-2xl ring-2 ring-cyan-400" style={{ width: box.w, height: box.h }}
        onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onWheel={wheel}>

        <div className="absolute inset-0 pointer-events-none" style={{ backgroundImage: "linear-gradient(rgba(34,211,238,.18) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,.18) 1px, transparent 1px)", backgroundSize: `${box.w / 3}px ${box.h / 3}px` }} />

        <button onClick={() => img && autoAlign(img)} className="px-3 py-1.5 text-xs rounded-lg bg-emerald-500/20 text-emerald-200">Auto</button>
        <button onClick={() => img && setV(fit(img, v.rot))} className="px-3 py-1.5 text-xs rounded-lg bg-white/10">Reset</button>
      </div>
      <div className="w-full max-w-xl mt-3 grid grid-cols-2 gap-2">
        <button onClick={onSkip} className="py-3 rounded-xl bg-white/10 text-sm font-bold">Use whole photo</button>
        <button disabled={!img} onClick={confirm} className="py-3 rounded-xl bg-cyan-500 text-slate-950 text-sm font-black disabled:opacity-30">✔ Use this sheet</button>
      </div>
    </div>,
    document.body
  );
}

/* ===================== LIVE CAMERA (auto-capture when the 4 corners are steady) ===================== */
function LiveScanner({ n, onResult, onClose }) {
  useEffect(() => { window.__jordynBusy = (window.__jordynBusy || 0) + 1; return () => { window.__jordynBusy = Math.max(0, (window.__jordynBusy || 1) - 1); }; }, []);   // random human check waits while scanning
  const videoRef = useRef(null), streamRef = useRef(null);
  const [status, setStatus] = useState("Starting camera…");
  const [err, setErr] = useState("");
  const [count, setCount] = useState(0);
  const [flash, setFlashOn] = useState(false);
  const [box, setBox] = useState(frameSize());
  const [torch, setTorch] = useState(false), [torchMsg, setTorchMsg] = useState("");
  const torchRef = useRef(null);
  const toggleTorch = async () => { const t = torchRef.current; if (!t) return; try { await t.applyConstraints({ advanced: [{ torch: !torch }] }); setTorch(!torch); } catch (e) {} };
  const state = useRef({ hist: [], lastCode: null, cooldownUntil: 0, needGone: false, gone: 0 });

  useEffect(() => {
    let alive = true, timer = null;
    (async () => {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no camera API");
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
        if (!alive) { s.getTracks().forEach(t => t.stop()); return; }
        streamRef.current = s; const v = videoRef.current; v.srcObject = s; await v.play();
        setStatus("Show ONE sheet inside the frame, with all 4 black corners visible.");
        timer = setInterval(tick, 150);
        try {                                             // flashlight: Android Chrome supports it; iPhone browsers don't
          const track = s.getVideoTracks()[0], caps = track.getCapabilities ? track.getCapabilities() : {};
          if (caps.torch) { torchRef.current = track; await track.applyConstraints({ advanced: [{ torch: true }] }); setTorch(true); }
          else setTorchMsg("Tip: this phone/browser can't control the flashlight. Scan in good light.");
        } catch (e) { setTorchMsg("Tip: scan in good light."); }
      } catch (e) {
        setErr("The live camera isn't available here. It works on the website version of the app (opened in Chrome or Safari). In the Claude app, use 📸 Take photo instead.");
      }
    })();
    const onResize = () => setBox(frameSize()); window.addEventListener("resize", onResize);
    return () => { alive = false; clearInterval(timer); window.removeEventListener("resize", onResize); if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); };
  }, []);

  const capture = (manual) => {
    const v = videoRef.current; if (!v || !v.videoWidth) return;
    const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext("2d").drawImage(v, 0, 0);
    const res = readSheet(c, n);
    if (!res.ok) { if (manual) setStatus("Couldn't find the 4 black corners. Move closer and hold steady."); return false; }
    const st = state.current;
    if (!manual && res.code && res.code === st.lastCode) { st.needGone = true; return false; }   // same sheet still in view
    st.lastCode = res.code; st.cooldownUntil = Date.now() + 900; st.needGone = !res.code; st.gone = 0; st.hist = [];
    try { navigator.vibrate && navigator.vibrate(70); } catch (e) {}
    setFlashOn(true); setTimeout(() => setFlashOn(false), 180);
    setCount(x => x + 1);
    setStatus(res.code ? `✔ ${res.code} captured. Next sheet!` : "✔ Captured (no code dots: you'll type the code). Next sheet!");
    onResult(res, "live camera");
    return true;
  };

  const tick = () => {
    const v = videoRef.current, st = state.current; if (!v || !v.videoWidth) return;
    const small = toGray(v, 400); let cc = coarseCorners(small);
    if (!cc && Date.now() - (st.lastFull || 0) > 450) {          // other sheets or strong tilt in view: full search, a few times a second
      st.lastFull = Date.now();
      const loc = locateSheet(v, n);
      if (loc && loc.ring >= 0.5) { const f = small.W / loc.G.W; cc = { pts: loc.pts.map(p => ({ x: p.x * f, y: p.y * f })) }; }
    }
    if (!cc) { st.hist = []; st.gone++; if (st.gone >= 2) { st.needGone = false; st.lastCode = null; } if (Date.now() > st.cooldownUntil) setStatus("Show ONE sheet inside the frame, with all 4 black corners visible."); return; }
    st.gone = 0;

    const p = cc.pts, w = small.W;

      {flash && <div className="absolute inset-0 bg-white/70 pointer-events-none" />}
      <div className="relative z-10 flex items-center justify-between p-3 text-white text-sm bg-gradient-to-b from-black/70 to-transparent">
        <span>🎥 Live scan · <b>{count}</b> captured</span>
        <span className="flex gap-2">
          {torchRef.current && <button onClick={toggleTorch} className={`px-3 py-1.5 rounded-lg font-bold ${torch ? "bg-amber-400 text-slate-950" : "bg-white/15"}`}>⚡ {torch ? "On" : "Off"}</button>}
          <button onClick={onClose} className="px-3 py-1.5 rounded-lg bg-white/15 font-bold">Done</button>
        </span>
      </div>
      <div className="relative z-10 flex-1 flex items-center justify-center pointer-events-none">
        <div className="relative rounded-md ring-2 ring-cyan-400 shadow-[0_0_0_9999px_rgba(0,0,0,0.45)]" style={{ width: box.w, height: box.h }}>
          {[["left", "top"], ["right", "top"], ["left", "bottom"], ["right", "bottom"]].map(([x, y]) =>
            <span key={x + y} className="absolute border-2 border-white" style={{ [x]: inset, [y]: inset, width: g, height: g }} />)}
        </div>
      </div>
      <div className="relative z-10 p-3 pb-5 text-center bg-gradient-to-t from-black/80 to-transparent">
        {err ? <p className="text-amber-300 text-sm mb-3">{err}</p> : <p className="text-white text-sm mb-3">{status}</p>}
        {!err && <button onClick={() => capture(true)} className="w-16 h-16 rounded-full bg-white border-4 border-cyan-400 shadow-lg" aria-label="Capture now" />}
        <p className="text-[11px] text-slate-300 mt-2">It captures by itself when the sheet is steady. Put the next sheet in front and it continues.</p>
        {torchMsg && <p className="text-[11px] text-amber-200 mt-1">{torchMsg}</p>}
      </div>
    </div>,
    document.body
  );
}

function ScanPanel({ onStudent, onKey, n, hasKey, meta, queue, scannedIds, absent, onAbsent, onUnabsent, gradeSection, onReport }) {
  const [paused, setPaused] = useState(false);

    if (sound) (ok ? playBeep : playBuzz)();
    setFx({ ok, text, sub, img }); clearTimeout(fxT.current);
    fxT.current = setTimeout(() => setFx(null), ok ? (img ? 1400 : 1000) : 1800);
  };
  const [sample, setSample] = useState(undefined);
  const [imgOK, setImgOK] = useState(false);
  const [items, setItems] = useState([]);   // {id, thumb, status: done|review|align|error, code, answers, flagged, msg, cropBlob, blob}
  const [aligning, setAligning] = useState(null);
  const [live, setLive] = useState(false);
  const [busyId, setBusyId] = useState("");
  useEffect(() => {
    let alive = true;
    (async () => {
      const s = window.claude && window.claude.use ? await window.claude.use("sample") : null;

      if (s) { const lim = await s.limits().catch(() => null); if (alive) setImgOK(!!(lim && lim.images)); }
    })();
    return () => { alive = false; };
  }, []);
  const claudeOK = !!sample && imgOK;
  const patch = (id, p) => setItems(list => list.map(it => (it.id === id ? { ...it, ...p } : it)));

  const saveImages = (code, it) => { if (it.sheetBlob) imgStore.put(meta, code, it.sheetBlob, it.nameBlob); };
  const commit = (it, code, answers) => {
    const c = up(code).replace(/\s/g, "");
    if (c === "KEY") {
      if (answers.some(a => !a)) return "The answer key has blank items. Fill every item first.";
      onKey(answers.slice()); saveImages("KEY", it); return "";

    const m = c.match(/^([BG])-?(\d{1,2})$/); if (!m) return "Type a code like B-12 or G-3.";

  const handleResult = async (res, name, blob) => {

    if (!res.ok) { fire(false, "SCAN UNSUCCESSFUL", "Couldn't see all 4 black corners. Rescan the SAME sheet: whole sheet in view, phone flat above it, good light."); setItems(l => [{ id, status: "align", msg: "Couldn't see all 4 black corners (one may be cut off, covered or in shadow).", blob, name }, ...l]); return; }
    const crop = warpCrop(res, 5), thumb = crop.toDataURL("image/jpeg", 0.6);

    const cc = warpCrop(res, 8), cx = cc.getContext("2d"); cx.fillStyle = "#fff";    // copy for "Ask Claude": name blanked out
    cx.fillRect(NAME_STRIP[0] * 8, NAME_STRIP[1] * 8, (NAME_STRIP[2] - NAME_STRIP[0]) * 8, 6 * 8);

    const item = { id, thumb, cropBlob, sheetBlob, nameBlob, nameThumb, blob, name, code: res.code || "", answers: res.answers.slice(), flagged: res.flagged.slice() };
    const keyBlanks = res.code === "KEY" && res.answers.some(a => !a);

      fire(false, `${res.code || "THIS SHEET"} NEEDS YOUR CHECK`, why + ". It is NOT saved yet — fix it in the list, then tap Save.", true, nameThumb);

  const fromFile = async (file, alignedBlob) => {

  const Q = queue || [];
  const next = !hasKey ? { code: "KEY" } : Q.find(q => !(scannedIds && scannedIds.has(q.code)) && !(absent || []).includes(q.code));

        <span className="text-xs text-slate-400">{n} items · {hasKey ? "key saved ✔" : "scan or save the KEY first"}</span>
      </div>
      <p className="text-xs text-slate-400 mb-3">Sheets are read on this device in under a second: free, offline and private (photos never leave the phone).{claudeOK ? " Claude is only a backup for unclear sheets." : ""}</p>
      <div className="grid sm:grid-cols-3 gap-2">
        <button onClick={() => { ensureAC(); setLive(true); }} className="py-3 rounded-xl bg-cyan-500 text-slate-950 font-black">🎥 Live camera (auto)</button>
        <label className="py-3 rounded-xl bg-white/10 hover:bg-white/15 font-bold text-center cursor-pointer">📸 Take photo
          <input type="file" accept="image/*" capture="environment" className="hidden" onChange={e => { ensureAC(); Array.from(e.target.files || []).forEach(f => fromFile(f)); e.target.value = ""; }} /></label>
        <label className="py-3 rounded-xl bg-white/10 hover:bg-white/15 font-bold text-center cursor-pointer">🖼️ Choose photos
          <input type="file" accept="image/jpeg,image/png,image/webp" multiple className="hidden" onChange={e => { ensureAC(); Array.from(e.target.files || []).forEach(f => fromFile(f)); e.target.value = ""; }} /></label>
      </div>
      <p className="text-[11px] text-slate-500 mt-2">Tip: scan the ANSWER KEY sheet first. One sheet per photo, flat, good light, all 4 black corners visible. Upside-down or sideways photos are fine — the reader rotates them itself.</p>

      {Q.length > 0 && <div className="rounded-xl border border-cyan-400/40 bg-cyan-500/10 p-3 mt-3">
        {!allDone ? <>

              <p className="text-2xl font-black text-white truncate">{next.code === "KEY" ? "Scan the ANSWER KEY first" : <>Scanning {next.code}</>}</p>

            </div>

            </div>

            <button onClick={() => { setLive(false); setPaused(true); }} className="px-3 py-1.5 text-xs rounded-lg bg-amber-400/20 text-amber-200 hover:bg-amber-400/30">☕ Take a break</button>
          </div>
        </> : <>
          <p className="text-lg font-black text-emerald-300">🎉 100% accounted for — {doneCount} scanned{absRows.length ? `, ${absRows.length} absent` : ""}.</p>
          <button onClick={() => { ensureAC(); onReport && onReport(); }} className="w-full mt-2 py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-lg shadow-lg">🚀 Finalize and Generate Report on {gradeSection}</button>
          <p className="text-[11px] text-slate-400 mt-1 text-center">Opens the Gradesheet. To lock it into History, use ✅ Finalize Session in Summary & CSV.</p>
        </>}
        {absRows.length > 0 && <p className="text-[11px] text-slate-400 mt-2">Absent (tap to undo): {absRows.map(q => <button key={q.code} onClick={() => onUnabsent && onUnabsent(q.code)} className="underline mr-2 hover:text-white" title="Un-mark absent">{q.code} ✕</button>)}</p>}
      </div>}

      {items.length > 0 && <p className="text-sm text-slate-300 mt-4 mb-2">✔ {done} saved{toReview ? ` · ⚠ ${toReview} need your check` : ""}</p>}
      <div className="space-y-2">
        {items.map(it => (
          <div key={it.id} className={`flex gap-3 rounded-xl p-2 border ${it.status === "done" ? "border-emerald-400/30 bg-emerald-500/5" : it.status === "review" ? "border-amber-400/40 bg-amber-500/5" : "border-red-400/40 bg-red-500/5"}`}>
            {it.thumb ? <img src={it.thumb} alt="" className="w-14 rounded bg-white shrink-0 self-start" style={{ aspectRatio: "1/1.414" }} /> : <div className="w-14 shrink-0 rounded bg-slate-800 text-[10px] text-slate-500 flex items-center justify-center" style={{ aspectRatio: "1/1.414" }}>no sheet</div>}
            <div className="flex-1 min-w-0 text-sm">
              {it.status === "done" && <><p className="text-emerald-300 font-bold">✔ {it.code === "KEY" ? "ANSWER KEY saved" : `${it.code} saved`} · {it.answers.filter(Boolean).length}/{n} answered</p>
                {it.nameThumb && it.code !== "KEY" && <img src={it.nameThumb} alt="written name" title="The name written on this sheet" className="mt-1 h-7 max-w-full object-contain rounded bg-white" />}</>}
              {it.status !== "done" && <>
                <p className={`${it.status === "review" ? "text-amber-200" : "text-red-300"} text-xs mb-1`}>{it.msg}</p>
                {it.status === "align" && <button onClick={() => setAligning(it)} className="px-3 py-1.5 text-xs rounded-lg bg-cyan-500 text-slate-950 font-bold">Align by hand</button>}
                {(it.status === "review" || it.status === "error") && <>
                  {it.nameThumb && <img src={it.nameThumb} alt="written name" title="The name written on this sheet" className="h-7 max-w-full object-contain rounded bg-white mb-1" />}
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-xs text-slate-400">Code</span>
                    <input value={it.code} onChange={e => patch(it.id, { code: up(e.target.value) })} placeholder="B-12" className="w-24 bg-slate-900/70 border border-white/15 rounded px-2 py-1 text-xs font-mono text-white" />
                  </div>
                  {it.flagged.length > 0 && <div className="flex flex-wrap gap-x-3 gap-y-1 mb-1">
                    {it.flagged.map(q => <span key={q} className="flex items-center gap-1 text-xs"><b className="text-amber-200 w-6 text-right">{q}</b>
                      {["A", "B", "C", "D", ""].map(l => <button key={l || "x"} onClick={() => patch(it.id, { answers: it.answers.map((a, i) => (i === q - 1 ? (l || null) : a)) })}
                        className={`w-5 h-5 rounded-full text-[9px] font-bold border ${(it.answers[q - 1] || "") === l ? "bg-cyan-400 text-slate-950 border-cyan-300" : "border-white/25 text-slate-300"}`}>{l || "–"}</button>)}</span>)}
                  </div>}
                  <div className="flex flex-wrap gap-2 mt-1">
                    {it.status === "review" && <button onClick={() => { const e = commit(it, it.code, it.answers); if (e) patch(it.id, { msg: e }); else patch(it.id, { status: "done", code: up(it.code), msg: "" }); }} className="px-3 py-1.5 text-xs rounded-lg bg-emerald-500 text-slate-950 font-bold">Save</button>}
                    {claudeOK && <button disabled={busyId === it.id} onClick={() => askClaude(it)} className="px-3 py-1.5 text-xs rounded-lg bg-white/10 disabled:opacity-40">{busyId === it.id ? "Asking Claude…" : "Ask Claude"}</button>}
                    <button onClick={() => setItems(l => l.filter(x => x.id !== it.id))} className="px-3 py-1.5 text-xs rounded-lg bg-white/5 text-slate-400">Remove</button>
                  </div>
                  {it.flagged.length > 0 && <p className="text-[10px] text-slate-500 mt-1">Look at the paper for these items (double, light or erased marks) and tap the right letter, or – for blank.</p>}
                </>}
              </>}
            </div>
          </div>))}
      </div>
      </>}
      {live && !paused && <LiveScanner n={n} onClose={() => setLive(false)} onResult={res => handleResult(res, "live camera", null)} />}
      <ScanFlash fx={fx} />
      {aligning && <SheetAligner file={aligning.blob} index={0} total={1}
        onDone={async b => { const it = aligning; setAligning(null); setItems(l => l.filter(x => x.id !== it.id)); fromFile(it.blob, b); }}
        onSkip={() => setAligning(null)} onCancel={() => setAligning(null)} />}
    </Card>
  );
}

/* ===================== CLASS ROSTER (masterlist) ===================== */
const ROSTER_ROWS = 50;
const rosterKey = label => "roster_" + String(label).replace(/[^\w]+/g, "_");
const sectionOf = label => String(label).split(" – ").slice(1).join(" – ") || label;
/* One pasted line -> a learner name. Handles "1. DELA CRUZ, JUAN", "B1  DELA CRUZ, JUAN", Excel rows with tabs (LRN, No., Name…). */
function cleanName(line) {
  let cells = String(line).split("\t").map(c => c.trim()).filter(Boolean);
  if (!cells.length) return "";
  // Excel row: keep the cells that have letters (drop numbers / LRN / sex columns), prefer the one with a comma
  const lettered = cells.filter(c => /[A-Za-zÑñ]{2,}/.test(c) && !/^(M|F|MALE|FEMALE)$/i.test(c));
  let name = lettered.find(c => c.includes(",")) || lettered.join(" ") || "";
  name = name.replace(/^\s*(?:[BG]\s*-?\s*)?\d+\s*[.)\-:]?\s+/i, "");   // leading "1." "B1" "B-1 " numbering
  name = name.replace(/\s+/g, " ").trim();
  return up(name);
}
const parseNames = text => String(text || "").split(/\r?\n/).map(cleanName).filter(Boolean);

/* "LAST, GIVEN, MIDDLE" -> "LAST, GIVEN M." (full middle name becomes its initial) */
function toMiddleInitial(name) {
  const m = String(name).match(/^([^,]+),\s*([^,]+),\s*(.+)$/);
  if (!m) return name;
  const mid = m[3].trim();
  const initial = mid[0];
  return `${m[1].trim()}, ${m[2].trim()} ${initial ? initial.toUpperCase() + "." : ""}`.trim();
}
const collator = new Intl.Collator("es", { sensitivity: "base" });   /* Spanish order puts Ñ after N, as in Filipino class records */
const lastNameOf = nm => String(nm).split(",")[0].trim();
const compareNames = (a, b) => collator.compare(lastNameOf(a), lastNameOf(b)) || collator.compare(a, b);
/* Rows that break A–Z order or leave a gap between names -> Set of row indexes */
function orderProblems(arr) {
  const bad = new Set(); let lastIdx = -1;
  const lastFilled = arr.reduce((m, v, i) => (v ? i : m), -1);
  arr.forEach((v, i) => {
    if (!v) { if (i < lastFilled) bad.add(i); return; }
    if (lastIdx >= 0 && compareNames(arr[lastIdx], v) > 0) { bad.add(lastIdx); bad.add(i); }
    lastIdx = i;
  });
  return bad;
}

function RosterPage({ label, initial, onSave, onBack, onDownload, onCodeList, flash }) {
  const blank = () => Array(ROSTER_ROWS).fill("");
  const fit = arr => { const a = blank(); (arr || []).slice(0, ROSTER_ROWS).forEach((v, i) => { a[i] = v || ""; }); return a; };
  const [boys, setBoys] = useState(fit(initial && initial.boys));
  const [girls, setGirls] = useState(fit(initial && initial.girls));
  const [paste, setPaste] = useState({ B: "", G: "" });
  const [dirty, setDirty] = useState(false);
  const [checking, setChecking] = useState(false);
  const [bad, setBad] = useState({ B: new Set(), G: new Set() });
  const [saved, setSaved] = useState(!!(initial && (initial.boys || []).some(Boolean)));
  const [extra, setExtra] = useState(["", "", "", ""]);   // Print Extra Sheets: up to 4 learners = 1 A4 page
  const [grade, sec] = [String(label).split(" – ")[0], sectionOf(label)];
  const saveLabel = `Save Learners in ${grade} – Section ${sec}`;

  const set = (g, arr) => { (g === "B" ? setBoys : setGirls)(arr); setDirty(true); setSaved(false); setBad(b => ({ ...b, [g]: new Set() })); };
  const applyPaste = (g, startAt = 0, text) => {
    const names = parseNames(text != null ? text : paste[g]).map(toMiddleInitial);
    if (!names.length) return flash("Nothing to paste. Copy the names from your class record first.");
    const arr = (g === "B" ? boys : girls).slice();
    const extra = Math.max(0, startAt + names.length - ROSTER_ROWS);
    names.slice(0, ROSTER_ROWS - startAt).forEach((nm, k) => { arr[startAt + k] = nm; });
    set(g, arr); if (text == null) setPaste({ ...paste, [g]: "" });
    flash(`${Math.min(names.length, ROSTER_ROWS - startAt)} ${g === "B" ? "boys" : "girls"} filled from ${g}-${startAt + 1}.` + (extra ? ` ${extra} name(s) did not fit (max ${ROSTER_ROWS}).` : ""));
  };
  const sortAZ = g => { const arr = (g === "B" ? boys : girls).filter(Boolean).sort(compareNames); set(g, fit(arr)); flash(`${g === "B" ? "Boys" : "Girls"} sorted A–Z by last name. Codes renumbered.`); };
  const count = arr => arr.filter(Boolean).length;

  const trySave = () => {
    setChecking(true);
    setTimeout(async () => {
      const b = orderProblems(boys), gl = orderProblems(girls);
      setBad({ B: b, G: gl }); setChecking(false);
      if (b.size || gl.size) { flash("Some names are not in A–Z order by last name (shown in red). Fix them or tap Sort A–Z."); return; }
      const ok = await onSave({ boys: boys.map(x => x.trim()), girls: girls.map(x => x.trim()) });
      if (ok) { setDirty(false); setSaved(true); }
    }, 3000);
  };

  const Col = ({ g, arr, tone, title }) => (
    <div className="glass rounded-2xl p-3">
      <div className={`flex items-center justify-between px-3 py-2 rounded-xl text-white mb-3 ${tone}`}>
        <h3 className="font-black">{title}</h3><span className="text-sm">{count(arr)} enrolled</span>
      </div>
      <Label>Paste {g === "B" ? "boys" : "girls"} here (one per line: LAST NAME, Given Name, Middle Initial)</Label>
      <textarea value={paste[g]} onChange={e => setPaste({ ...paste, [g]: e.target.value })} placeholder={g === "B" ? "ABADIA, KRISTOPHER RYAN N.\nACLA, DAMIAN JAY D.\n…" : "AMOR, MARIA CLARA S.\nBAUTISTA, ANA L.\n…"}
        className="w-full min-h-[6rem] font-mono text-xs bg-slate-950/70 border border-white/10 rounded-lg p-2 text-slate-200" />
      <div className="flex flex-wrap gap-2 mt-1 mb-2">
        <button onClick={() => applyPaste(g)} className="px-3 py-1.5 text-xs rounded-lg bg-cyan-500 text-slate-950 font-bold">Fill {g}-1 to {g}-{ROSTER_ROWS}</button>
        {bad[g].size > 0 && <button onClick={() => sortAZ(g)} className="px-3 py-1.5 text-xs rounded-lg bg-red-500 text-white font-bold">🔤 Sort A–Z for me</button>}
        <button onClick={() => set(g, blank())} className="px-3 py-1.5 text-xs rounded-lg bg-white/10">Clear column</button>
      </div>
      {bad[g].size > 0 && <p className="text-xs text-red-300 mb-2">Red rows are out of A–Z order by last name (or empty rows between names). Move them, or tap Sort A–Z.</p>}
      <div className="max-h-[60vh] overflow-y-auto pr-1 space-y-1">
        {arr.map((v, i) => (

/* Google checks the password on Google's own page: this website never sees anyone's email password. */
const loadScript = (src, id) => new Promise((res, rej) => {
  if (document.getElementById(id)) { const el = document.getElementById(id); if (el.dataset.ok) return res(); el.addEventListener("load", () => res()); el.addEventListener("error", rej); return; }
  const el = document.createElement("script"); el.src = src; el.async = true; el.id = id;
  el.onload = () => { el.dataset.ok = "1"; res(); }; el.onerror = () => { el.remove(); rej(new Error("load")); };
  document.head.appendChild(el); setTimeout(() => rej(new Error("timeout")), 10000);
});
const b64urlJson = s => JSON.parse(dec.decode(Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(s.length / 4) * 4, "=")), c => c.charCodeAt(0))));
/* Check the Google ID token: audience, issuer, expiry, verified email, and (when Google's keys can be fetched) the RS256 signature. */
async function checkGoogleToken(jwt) {
  const [h, p, sig] = String(jwt).split(".");
  const head = b64urlJson(h), pay = b64urlJson(p);
  if (pay.aud !== CFG.googleClientId) throw new Error("aud");
  if (!["accounts.google.com", "https://accounts.google.com"].includes(pay.iss)) throw new Error("iss");
  if (!pay.exp || pay.exp * 1000 < Date.now() - 60000) throw new Error("exp");
  if (!pay.email || pay.email_verified === false) throw new Error("email");
  try {
    const jwks = await (await fetch("https://www.googleapis.com/oauth2/v3/certs")).json();
    const jwk = (jwks.keys || []).find(k => k.kid === head.kid);
    if (jwk) {
      const key = await crypto.subtle.importKey("jwk", jwk, { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" }, false, ["verify"]);
      const raw = Uint8Array.from(atob(sig.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(sig.length / 4) * 4, "=")), c => c.charCodeAt(0));
      if (!(await crypto.subtle.verify("RSASSA-PKCS1-v1_5", key, raw, enc.encode(h + "." + p)))) throw new Error("sig");
    }
  } catch (e) { if (e.message === "sig") throw e; }   // offline key fetch: the token still came straight from Google's button
  return { email: pay.email, name: pay.name || "" };
}
/* Backup sign-in: Google's classic pop-up (works where the newer sign-in button is blocked).
   Google returns a short-lived access token; the verified email is read from Google's own userinfo service. */
async function popupGoogleSignIn() {
  await loadScript("https://accounts.google.com/gsi/client", "gsi-client");
  const tok = await new Promise((res, rej) => {
    const tc = google.accounts.oauth2.initTokenClient({ client_id: CFG.googleClientId, scope: "openid email profile", prompt: "select_account",
      callback: r => r && r.access_token ? res(r) : rej(new Error(r && r.error || "no token")), error_callback: e => rej(new Error(e && e.type || "popup")) });
    tc.requestAccessToken();
  });
  const u = await (await fetch("https://www.googleapis.com/oauth2/v3/userinfo", { headers: { Authorization: "Bearer " + tok.access_token } })).json();
  if (!u.email || u.email_verified === false) throw new Error("email");
  return u.email;
}

/* Random "Verify you are human" checks while someone uses the website.
   First check 5-15 minutes after opening, then every 20-45 minutes of time on the page (random).
   Never interrupts the live camera or the photo aligner: it waits until they close. */
const rnd = (a, b) => (a + Math.random() * (b - a)) * 60000;
function RandomHumanCheck() {
  const [show, setShow] = useState(false), [failed, setFailed] = useState(false), [k, setK] = useState(0);
  const st = useRef({ used: 0, due: rnd(5, 15), last: Date.now() });
  useEffect(() => {
    const t = setInterval(() => {
      const now = Date.now(), r = st.current;
      if (document.visibilityState === "visible") r.used += Math.min(now - r.last, 60000);
      r.last = now;
      if (!show && r.used >= r.due && !(window.__jordynBusy > 0)) { setFailed(false); setK(x => x + 1); setShow(true); }
    }, 15000);
    return () => clearInterval(t);
  }, [show]);
  const pass = tok => { if (!tok) return; setTimeout(() => { st.current.used = 0; st.current.due = rnd(20, 45); setShow(false); }, 600); };
  if (!show) return null;
  return ReactDOM.createPortal(

}

    const reset = () => { clearTimeout(idle.current); idle.current = setTimeout(lockNow, IDLE_MS); };
    const evs = ["pointerdown", "keydown", "scroll", "touchstart"];
    evs.forEach(e => window.addEventListener(e, reset, { passive: true })); reset();
    window.__jordynLock = lockNow; window.__jordynSwitch = switchAccount;
    return () => { clearTimeout(idle.current); evs.forEach(e => window.removeEventListener(e, reset)); };
  }, [phase]);

  function lockNow() { if (GOOGLE_ONLY && Vault.unlockedBy === "device") return switchAccount(); Vault.lock(); setA(""); setB(""); setErr(""); setMode("password"); setByAdmin(false); setPhase("locked"); }
  function switchAccount() { Vault.lock(); Acct.clear(); try { window.google && google.accounts && google.accounts.id.disableAutoSelect(); } catch (e) {} setA(""); setB(""); setErr(""); setEmail(""); setMode("password"); setByAdmin(false); setPhase("signin"); }

  // after Google (or the typed email) tells us WHO this is: open that email's data on this device, or start a new history
  const signedIn = async (mail, via) => {
    setErr(""); await Acct.use(mail, via);
    if (GOOGLE_ONLY && via === "google") return openGoogle();
    setPhase(Vault.exists() ? "locked" : Vault.legacyExists() ? "legacy" : "setup");
  };
  /* Google mode: no password. Known email on this device -> its data opens; new email -> new history. */
  const openGoogle = async () => {
    setBusy(true);
    try {
      if (Vault.exists()) {
        if (!Vault.hasDevice()) { setBusy(false); return setPhase("locked"); }   // made with a password before: type it once
        await Vault.unlock("device");
      } else if (Vault.legacyExists()) { setBusy(false); return setPhase("legacy"); }
      else await Vault.createDevice();
      Acct.remember(); setPhase("open");
    } catch (e) { setErr("This browser couldn't open your data (" + (e.message || "device key") + ")."); setPhase("signin"); }
    setBusy(false);
  };
  const openOffline = async acc => { Acct.useId(acc.id, acc.hint, "offline"); return openGoogle(); };
  const typedEmail = () => {
    const m = email.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) return setErr("Type a valid email address.");
    signedIn(m, "typed");
  };
  const create = async () => {
    const p = pwProblem(a, b); if (p) return setErr(p);
    setBusy(true); setErr("");
    try { const c = await Vault.create(a); Acct.remember(); setCode(c); setPhase("recovery"); setA(""); setB(""); } catch (e) { setErr("Couldn't create the lock on this browser."); }
    setBusy(false);
  };
  const unlock = async () => {
    if (!a) return; setBusy(true); setErr("");
    try { await Vault.unlock(mode, a); if (GOOGLE_ONLY && Acct.via === "google") await Vault.addDevice(); Acct.remember(); setA(""); setByAdmin(mode !== "password"); setPhase("open"); }
    catch (e) { setErr(mode === "admin" ? (e.message === "no-admin" ? "No admin key is set up for this website yet." : "Wrong master password.") : mode === "recovery" ? "That recovery code doesn't match." : "Wrong password."); }
    setBusy(false);
  };
  const adopt = async () => {
    if (!a) return; setBusy(true); setErr("");
    try { await Vault.adoptLegacy(a); if (GOOGLE_ONLY && Acct.via === "google") await Vault.addDevice(); Acct.remember(); setA(""); setPhase("open"); } catch (e) { setErr("Wrong password for the old data."); }
    setBusy(false);
  };
  const who = <div className="flex items-center justify-between bg-slate-900/60 rounded-xl px-3 py-2 mb-3 text-sm">
    <span className="text-slate-200">👤 <b>{Acct.hint}</b>{Acct.via === "google" && <span className="text-emerald-300 text-xs"> ✔ Google</span>}</span>
    <button onClick={switchAccount} className="text-xs text-cyan-300 underline">Switch account</button></div>;

  if (phase === "loading") return <div className="min-h-screen flex items-center justify-center text-cyan-300">Loading JordynAI…</div>;
  if (phase === "open") return <>
    {!store.db && <div className="bg-slate-950/80 border-b border-white/10 text-xs text-slate-300 flex items-center justify-end gap-3 px-4 py-1.5">
      <span>👤 {Acct.hint || "This device"}</span>
      {Sync.available() && <SyncBadge />}
      <button onClick={lockNow} className="text-cyan-300 hover:underline">🔒 Lock</button>
      {Acct.id && <button onClick={switchAccount} className="text-cyan-300 hover:underline">⇄ Switch account</button>}
    </div>}
    {!store.db && <RandomHumanCheck />}
    {byAdmin && <div className="bg-amber-500/20 border-b border-amber-400/40 text-amber-100 text-xs text-center p-2">Unlocked with the {Vault.unlockedBy === "admin" ? "admin master password" : "recovery code"}. Set a new password in History → Security.</div>}
    <React.Fragment key={appKey}>{children}</React.Fragment>
  </>;
  if (phase === "recovery") return <GateShell><RecoveryShow code={code} onDone={() => { setCode(""); setPhase("open"); }} /></GateShell>;
  if (phase === "signin") {
    const known = Acct.list();
    return (
      <GateShell>
        <h2 className="text-lg font-black text-white mb-1">👋 Sign in</h2>
        {!offline ? <>
          <p className="text-sm text-slate-300 mb-3">Sign in with your Google account. No other password needed. Google checks your password on its own page: <b>this website never sees your email password.</b></p>
          {busy && <p className="text-xs text-cyan-300 mb-2">Opening your data…</p>}
          <GoogleButton onEmail={m => signedIn(m, "google")} onFail={m => { if (m === "offline") { setOffline(true); setErr(""); } else setErr(m); }} />
          <button onClick={async () => { setErr(""); try { const m = await popupGoogleSignIn(); signedIn(m, "google"); } catch (e) { setErr(e.message === "popup" || e.message === "popup_closed" ? "The Google window was closed or blocked. Allow pop-ups for this site and try again." : "Google sign-in didn't finish (" + e.message + "). Try again."); } }} className="w-full mt-2 text-xs text-cyan-300 underline">Button not working? Sign in with the Google pop-up instead</button>
        </> : GOOGLE_ONLY ? <>
          <p className="text-sm text-slate-300 mb-3">No internet, so Google can't sign you in right now. Accounts that signed in with Google <b>on this device in the last 24 hours</b> can still open:</p>
          <div className="space-y-2">
            {known.filter(k => k.g && Date.now() - k.g < OFFLINE_GRACE_MS).map(k => <button key={k.id} disabled={busy} onClick={() => openOffline(k)} className="w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/15 font-bold text-sm">👤 {k.hint}</button>)}
            {!known.some(k => k.g && Date.now() - k.g < OFFLINE_GRACE_MS) && <p className="text-xs text-amber-200">None yet. Connect to the internet and sign in with Google.</p>}
            <button onClick={() => window.location.reload()} className="w-full py-2 rounded-xl bg-cyan-500/20 text-cyan-200 text-sm">↻ Try Google again</button>
          </div>
        </> : <>
          <p className="text-sm text-slate-300 mb-3">{CFG.googleClientId ? "No internet: type the email you used on this device." : "Type your email. Then make a NEW password just for this app."} <b className="text-amber-200">Never type your Gmail/email password here.</b></p>
          <input type="email" autoComplete="email" placeholder="you@deped.gov.ph" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={e => e.key === "Enter" && typedEmail()} className="w-full bg-slate-900/70 border border-white/10 rounded-lg px-3 py-2.5 text-slate-100 outline-none focus:ring-2 focus:ring-cyan-400" />
          <button onClick={typedEmail} className="w-full mt-3 py-3 rounded-xl bg-cyan-500 text-slate-950 font-black">Continue</button>
        </>}
        {err && <p className="text-sm text-red-300 mt-2">{err}</p>}
        {known.length > 0 && <p className="text-xs text-slate-500 mt-4">Used on this device: {known.map(k => k.hint).join(", ")}</p>}
        <p className="text-[11px] text-slate-500 mt-3">Your data stays on this device, locked per email. The same email on another device starts a new, empty history there.</p>
      </GateShell>
    );
  }
  if (phase === "legacy") return (
    <GateShell>
      {who}
      <h2 className="text-lg font-black text-white mb-1">📦 Older data found</h2>
      <p className="text-sm text-slate-300 mb-3">This device has data saved before email sign-in. Type its old password to move it into <b>{Acct.hint}</b>, or start a new, empty history.</p>
      <PwInput autoFocus placeholder="Old password" value={a} onChange={e => setA(e.target.value)} onKeyDown={e => e.key === "Enter" && adopt()} />
      {err && <p className="text-sm text-red-300 mt-2">{err}</p>}
      <button disabled={busy || !a} onClick={adopt} className="w-full mt-3 py-3 rounded-xl bg-cyan-500 text-slate-950 font-black disabled:opacity-40">{busy ? "Moving…" : "Move my old data here"}</button>
      <button onClick={() => { setA(""); setErr(""); if (GOOGLE_ONLY && Acct.via === "google") openGoogle(); else setPhase("setup"); }} className="w-full mt-2 py-2.5 rounded-xl bg-white/10 font-bold text-sm">Start a new history instead</button>
    </GateShell>
  );
  if (phase === "setup") return (
    <GateShell>
      {who}
      <h2 className="text-lg font-black text-white mb-1">🔒 Make your device password</h2>
      <p className="text-sm text-slate-300 mb-3">First time for this email on this device, so a <b>new, empty history</b> starts here. Your classes, learner lists, results and sheet images will be <b>encrypted</b> with this password. <b className="text-amber-200">Make a NEW password; don't reuse your email password.</b>{hasAdmin ? " The school admin's master password can also open it if you forget yours." : ""}</p>
      <div className="space-y-2">
        <PwInput placeholder="New password (8+ characters)" value={a} onChange={e => setA(e.target.value)} />
        <PwInput placeholder="Type it again" value={b} onChange={e => setB(e.target.value)} onKeyDown={e => e.key === "Enter" && create()} />
      </div>
      {err && <p className="text-sm text-red-300 mt-2">{err}</p>}
      <button disabled={busy} onClick={create} className="w-full mt-4 py-3 rounded-xl bg-cyan-500 text-slate-950 font-black disabled:opacity-40">{busy ? "Setting up…" : "Create password"}</button>
    </GateShell>
  );
  // locked
  return (
    <GateShell>
      {Acct.id && who}
      {GOOGLE_ONLY && Acct.via === "google" && <p className="text-xs text-amber-100 bg-amber-500/10 border border-amber-400/30 rounded-lg p-2 mb-3">This email's data on this device was locked with a password before Google sign-in. Type it <b>one last time</b>; after this, Google alone opens it.</p>}
      <div className="flex gap-1 bg-slate-900/60 rounded-xl p-1 mb-3 text-xs">
        {[["password", "Password"], ["recovery", "Recovery code"], ...(hasAdmin ? [["admin", "Admin"]] : [])].map(([k, l]) =>
          <button key={k} onClick={() => { setMode(k); setA(""); setErr(""); }} className={`flex-1 py-2 rounded-lg ${mode === k ? "bg-cyan-500 text-slate-950 font-bold" : "text-slate-300"}`}>{l}</button>)}
      </div>
      {mode === "password" && <PwInput autoFocus placeholder="Device password" value={a} onChange={e => setA(e.target.value)} onKeyDown={e => e.key === "Enter" && unlock()} />}
      {mode === "admin" && <><p className="text-xs text-slate-400 mb-2">For the school admin only.</p><PwInput autoFocus placeholder="Admin master password" value={a} onChange={e => setA(e.target.value)} onKeyDown={e => e.key === "Enter" && unlock()} /></>}
      {mode === "recovery" && <><p className="text-xs text-slate-400 mb-2">Type your 12 words with spaces between them.</p>
        <textarea autoFocus value={a} onChange={e => setA(e.target.value)} rows={3} className="w-full bg-slate-900/70 border border-white/10 rounded-lg px-3 py-2 text-slate-100 font-mono text-sm outline-none focus:ring-2 focus:ring-cyan-400" /></>}
      {err && <p className="text-sm text-red-300 mt-2">{err}</p>}
      <button disabled={busy || !a} onClick={unlock} className="w-full mt-4 py-3 rounded-xl bg-cyan-500 text-slate-950 font-black disabled:opacity-40">{busy ? "Unlocking…" : "🔓 Unlock"}</button>
      <details className="mt-4 text-xs text-slate-500">
        <summary className="cursor-pointer">Forgot everything?</summary>
        <p className="mt-2">Without your password, your recovery code or the admin, this email's data on this device can't be opened. You can erase it and start fresh. Other emails on this device are not touched.</p>
        <button onClick={async () => { if (window.__eraseArmed) { await imgStore.wipe(); Vault.erase(); window.location.reload(); } else { window.__eraseArmed = true; setErr("Tap 'Erase' again to confirm. Everything for " + (Acct.hint || "this device") + " on this device will be deleted."); } }} className="mt-2 px-3 py-1.5 rounded-lg bg-red-600/80 text-white font-bold">Erase {Acct.hint || "this device"}</button>
      </details>
    </GateShell>
  );
}

/* Security card (History tab) */
function SecurityCard({ flash, saveFile }) {
  const [cur, setCur] = useState(""), [p1, setP1] = useState(""), [p2, setP2] = useState("");
  const [msg, setMsg] = useState(""), [code, setCode] = useState("");
  const [m1, setM1] = useState(""), [m2, setM2] = useState(""), [adminMsg, setAdminMsg] = useState("");
  const [busy, setBusy] = useState(false);
  if (store.db) return <Card><h3 className="font-black text-white mb-1">🔒 Security</h3><p className="text-xs text-slate-400">Inside Claude, your data is protected by your Claude account. The password lock is used on the website version.</p></Card>;
  const change = async () => {
    const p = pwProblem(p1, p2); if (p) return setMsg(p);
    setBusy(true); setMsg("");
    try {
      if (Vault.unlockedBy === "password") { const v = JSON.parse(localStorage.getItem(vaultKey())); await unwrapWithSecret(v.wraps.pw, cur); }   // check current password
      await Vault.setPassword(p1); setCur(""); setP1(""); setP2(""); setMsg("✔ Password changed."); flash("Password changed.");
    } catch (e) { setMsg("Your current password is wrong."); }
    setBusy(false);
  };
  const googleMode = Vault.unlockedBy === "device";
  const makeAdminKey = async () => {
    const p = pwProblem(m1, m2); if (p) return setAdminMsg(p);
    if (m1.length < 12) return setAdminMsg("Use at least 12 characters for the master password.");
    setBusy(true);
    try { const k = await createAdminKey(m1); await saveFile(JSON.stringify(k, null, 2), "admin-key.json", "application/json"); setM1(""); setM2(""); setAdminMsg("✔ admin-key.json created. Send this file to Claude (or upload it to the website repo) to switch the admin lock on. Keep your master password secret; it is not in the file."); }
    catch (e) { setAdminMsg("Couldn't create the admin key."); }
    setBusy(false);
  };
  return (
    <div id="security" className="scroll-mt-24"><Card>
      <h3 className="font-black text-white mb-1">🛡️ Security</h3>
      {googleMode && <p className="text-sm text-emerald-200 mb-2">✔ Signed in with Google as <b>{Acct.hint}</b>. No password needed: Google checks who you are, and this email's data is locked to this browser on this device.</p>}
      <p className="text-xs text-slate-400 mb-3">Data on this device is encrypted. {googleMode ? "After 15 minutes without use, you sign in with Google again." : "Auto-lock after 15 minutes without use."} Admin lock: {Vault.adminKey ? <b className="text-emerald-300">ON</b> : <b className="text-amber-300">not set up</b>}.</p>
      <div className="flex flex-wrap gap-2 mb-4">
        <button onClick={() => window.__jordynLock && window.__jordynLock()} className="px-3 py-1.5 text-xs rounded-lg bg-white/10">🔒 Lock now</button>
        {!googleMode && <button onClick={async () => setCode(await Vault.newRecovery())} className="px-3 py-1.5 text-xs rounded-lg bg-white/10">📝 New recovery code</button>}
      </div>
      {code && <div className="mb-4"><RecoveryShow code={code} onDone={() => setCode("")} /></div>}
      {!googleMode && <><div className="grid sm:grid-cols-3 gap-2">
        {Vault.unlockedBy === "password" && <PwInput placeholder="Current password" value={cur} onChange={e => setCur(e.target.value)} />}
        <PwInput placeholder="New password" value={p1} onChange={e => setP1(e.target.value)} />
        <PwInput placeholder="New password again" value={p2} onChange={e => setP2(e.target.value)} />
      </div>
      <button disabled={busy} onClick={change} className="mt-2 px-4 py-2 text-sm rounded-lg bg-cyan-500 text-slate-950 font-bold disabled:opacity-40">Change password</button>
      {msg && <p className="text-xs text-slate-300 mt-1">{msg}</p>}</>}
      <SyncCard />
      <div className="mt-5 rounded-xl border border-amber-400/40 bg-amber-400/5 p-3">
        <h4 className="text-sm font-black text-amber-200">👑 Admin only: create the admin master key</h4>
        <p className="text-xs text-slate-400 mt-2">Choose your admin master password (12+ characters). The app creates <b>admin-key.json</b>, which lets every device add an admin lock that only your master password opens. The password itself is never saved. If you lose it, make a new key; devices update on their next unlock.</p>
        <div className="grid sm:grid-cols-2 gap-2 mt-2">
          <PwInput placeholder="Admin master password" value={m1} onChange={e => setM1(e.target.value)} />
          <PwInput placeholder="Type it again" value={m2} onChange={e => setM2(e.target.value)} />
        </div>
        <button disabled={busy} onClick={makeAdminKey} className="mt-2 px-4 py-2 text-sm rounded-lg bg-amber-400 text-slate-950 font-bold disabled:opacity-40">Create admin-key.json</button>
        {adminMsg && <p className="text-xs text-slate-300 mt-1">{adminMsg}</p>}
      </div>
    </Card></div>
  );
}

/* ===================== APP ===================== */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [saveMode, setSaveMode] = useState("");
  const [profile, setProfile] = useState(DEFAULT_PROFILE);
  const [config, setConfig] = useState(DEFAULT_CONFIG);
  const [key, setKey] = useState(Array(50).fill("A"));
  const [keySaved, setKeySaved] = useState(false);
  const [grade, setGrade] = useState("Grade 7");
  const [section, setSection] = useState("");
  const [classes, setClasses] = useState([]);
  const [students, setStudents] = useState([]);
  const [absent, setAbsent] = useState([]);                     // codes marked absent for THIS exam session
  const [rawText, setRawText] = useState("");
  const [rawErr, setRawErr] = useState("");
  const [passMark, setPassMark] = useState(70);
  const [history, setHistory] = useState([]);
  const [tab, setTab] = useState("setup");
  const [modal, setModal] = useState(null);
  const [shake, setShake] = useState("");
  const [toast, setToast] = useState("");
  const [openHist, setOpenHist] = useState(null);
  const keyRef = useRef(null);
  const [rosterView, setRosterView] = useState(null);
  const [rosters, setRosters] = useState({});

  const flash = m => { setToast(m); setTimeout(() => setToast(""), 2800); };
  const subj = subjectOf(config.subject);
  const n = config.itemCount;
  const tags = subj.comps ? (config.tags && config.tags.length === n ? config.tags : defaultTags(n, subj.comps)) : null;
  const compOf = i => (tags ? subj.comps[tags[i]] : "");
  const [quick, setQuick] = useState({});
  const setTags = async t => { const c = { ...config, tags: t }; setConfig(c); await store.set("config", c); };
  const cycleTag = i => setTags(tags.map((t, j) => j === i ? (t + 1) % subj.comps.length : t));
  const applyQuick = ci => {
    const items = parseItems(quick[ci], n);
    if (!items.length) return flash("Type item numbers like 1, 3, 6-8.");
    setTags(tags.map((t, j) => items.includes(j + 1) ? ci : t)); flash(`${items.length} item(s) set to ${subj.comps[ci]}.`);
  };
  const gradeSection = `${grade} – ${section || "(no section)"}`;
  const unlocked = profile.configured && keySaved;

  /* load saved data */
  useEffect(() => {
    (async () => {
      await store.init();
      setSaveMode(store.db ? "Saved to your Claude account" : "Saved in this browser only");
      const [p, c, k, ks, cl, h, pm, ss, ab] = await Promise.all([
        store.get("profile", DEFAULT_PROFILE), store.get("config", DEFAULT_CONFIG), store.get("key", null),
        store.get("keySaved", false), store.get("classes", []), store.get("history", []), store.get("passMarkV2", 70),
        store.get("sessionStudents", []), store.get("sessionAbsent", [])]);
      setProfile(p); setConfig(c); if (k) setKey(k); setKeySaved(!!ks); setClasses(cl || []); setHistory(h || []); setPassMark(pm || 70);
      if (Array.isArray(ss) && ss.length) setStudents(ss);                        // scanning survives closing the browser
      if (Array.isArray(ab) && ab.length) setAbsent(ab);
      const rs = {};
      for (const lbl of (cl || [])) {
        let v = localStore.get(rosterKey(lbl), null);
        if (!v && store.db) { const old = await store.get(rosterKey(lbl), null); if (old) { v = old; localStore.set(rosterKey(lbl), old); await store.set(rosterKey(lbl), null); } }
        if (v) rs[lbl] = v;
      }
      setRosters(rs);
      setLoaded(true);
      if (!p.configured) setModal("profile");
    })();
  }, []);

  const saveProfile = async p => { setProfile(p); setModal(null); await store.set("profile", p); flash("Profile saved. Your answer sheet header is updated."); };

  const updateConfig = async (patch, itemsChanged) => {
    let c = { ...config, ...patch };
    const s = subjectOf(c.subject);
    if (patch.slot) { c.examType = patch.slot === "TE" ? "term" : "summative"; if (c.examType !== config.examType) patch.examType = c.examType; }
    if (!c.slot) c.slot = c.examType === "term" ? "TE" : "ST1";
    if (c.examType === "summative" && s.termOnly) c.subject = "mapeh-music-arts";
    if (patch.examType && !("itemCount" in patch)) { c.itemCount = c.examType === "summative" ? 25 : 50; itemsChanged = true; }
    if (itemsChanged || patch.subject || patch.examType || !c.tags || c.tags.length !== c.itemCount) c.tags = defaultTags(c.itemCount, subjectOf(c.subject).comps);
    setConfig(c); await store.set("config", c);
    if (itemsChanged) {
      const k = Array.from({ length: c.itemCount }, (_, i) => key[i] || "A");
      setKey(k); setKeySaved(false); await store.set("key", k); await store.set("keySaved", false);
      setModal("keyPrompt");
    }
  };

  const saveKey = async () => {
    await store.set("key", key); await store.set("keySaved", true);
    setKeySaved(true); setModal("copyPrompt");
  };

  const onScannedKey = async k => {
    const c = { ...config, itemCount: k.length };
    if (!c.tags || c.tags.length !== k.length) c.tags = defaultTags(k.length, subjectOf(c.subject).comps);
    setConfig(c); setKey(k); setKeySaved(true);
    await store.set("config", c); await store.set("key", k); await store.set("keySaved", true);
  };

  const addClass = async () => {
    if (!section.trim()) return flash("Type a section name first.");
    const label = `${grade} – ${up(section.trim())}`;
    if (classes.includes(label)) return flash("That class is already saved.");
    const cl = [...classes, label]; setClasses(cl); setSection(up(section.trim())); await store.set("classes", cl); flash("Class saved.");
  };
  const pickClass = label => { const [g, ...s] = label.split(" – "); setGrade(g); setSection(s.join(" – ")); };
  const saveRoster = async (label, rs) => {
    const ok = localStore.set(rosterKey(label), rs);
    if (ok) { setRosters(x => ({ ...x, [label]: rs })); flash(`Students of ${label} saved.`); } else flash("Saving failed. Try again.");
    return ok;
  };
  const learnersOf = rs => {

                {s.marks.map((m, i) => <td key={i} title={`Answer: ${s.ans[i] || "-"}`} className={`p-1 text-center font-mono ${m ? "text-emerald-400" : "text-red-300 bg-red-500/10"}`}>{m ? "✓" : (s.ans[i] || "–")}</td>)}
                <td className="p-2 text-center font-bold">{s.score}/{n}</td><td className="p-2 text-center">{fmt(s.pct)}</td>
                <td className="p-2 text-center"><span className={`text-xs font-bold px-2 py-0.5 rounded ${s.pass ? "bg-emerald-500/20 text-emerald-300" : "bg-red-500/20 text-red-300"}`}>{s.pass ? "PASSED" : "FAILED"}</span></td>
                <td className="p-2"><Badge pct={s.pct} /></td>
                <td className="p-2 text-center">{imgKeys.includes(s.id) ? <button onClick={() => openImg(s.id)} className="text-lg" title="View scanned sheet">🖼️</button> : <span className="text-slate-600">–</span>}</td>
              </tr>))}
            {absentRows.map(id => (
              <tr key={id} className="border-t border-white/5 opacity-75">
                <td className="p-2 font-mono font-bold text-slate-400">{id}</td>
                <td className="p-2 text-slate-400">{toInitials(rosterName(id))}</td>
                <td colSpan={key.length} className="p-1 text-center text-xs text-slate-500">absent on exam day — no score, not counted in the statistics</td>
                <td className="p-2 text-center font-bold text-slate-400">—</td><td className="p-2 text-center text-slate-400">—</td>
                <td className="p-2 text-center"><span className="text-xs font-bold px-2 py-0.5 rounded bg-slate-500/30 text-slate-200">ABSENT</span></td>
                <td className="p-2 text-slate-500 text-xs">—</td>
                <td className="p-2 text-center"><span className="text-slate-600">–</span></td>
              </tr>))}
          </tbody>
        </table>
      </div>
    </div>
  );

  if (!loaded) return <div className="min-h-screen flex items-center justify-center text-cyan-300">Loading JordynAI…</div>;

  return (
    <div className="min-h-screen">
      {/* HEADER */}
      <header className="sticky top-0 z-40 bg-slate-950/70 backdrop-blur-xl border-b border-white/10">
        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3 justify-between">
          <div>
            <h1 className="text-xl font-black text-white">Jordyn<span className="text-cyan-400">AI</span> Exam Analyzer</h1>
            <p className="text-[11px] text-slate-400 font-mono">{profile.configured ? `${profile.region} · ${profile.division} · ${profile.school}` : "Set up your school profile"}</p>
          </div>
          <div className="flex flex-wrap gap-2">
            <button onClick={() => setModal("profile")} className="px-3 py-1.5 text-xs rounded-lg bg-white/10 hover:bg-white/15">🏫 Edit Profile / School</button>
            {!store.db && <button onClick={() => { setRosterView(null); setTab("setup"); setTimeout(() => { const el = document.getElementById("security"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 80); }} className="px-3 py-1.5 text-xs rounded-lg bg-white/10 hover:bg-white/15">🛡️ Security</button>}
            {!store.db && <button onClick={() => window.__jordynLock && window.__jordynLock()} className="px-3 py-1.5 text-xs rounded-lg bg-white/10 hover:bg-white/15" title="Lock now">🔒 Lock</button>}
            <button disabled={!unlocked} onClick={() => setModal("copyAS")} className="px-3 py-1.5 text-xs rounded-lg bg-amber-400 text-slate-950 font-bold disabled:opacity-30">📄 Copy A/S</button>
          </div>
        </div>
      </header>

      <div className="max-w-6xl mx-auto p-4 space-y-4">
        {!unlocked && (
          <div className="rounded-xl border border-amber-400/40 bg-amber-400/10 text-amber-200 text-sm p-3">
            🔒 {!profile.configured ? "Step 1: set your school profile." : "Step 2: choose Exam Type, Subject and Total Items, then encode and SAVE the Answer Key."} The other tabs unlock after that.
          </div>
        )}

        {rosterView && <RosterPage key={rosterView} label={rosterView} initial={rosters[rosterView]} flash={flash} onBack={() => setRosterView(null)} onSave={rs => saveRoster(rosterView, rs)} onDownload={(rs, kind, extra) => downloadSheets(rosterView, rs, kind, extra)} onCodeList={rs => downloadCodeList(rosterView, rs)} />}
        {!rosterView && <>
        {/* TABS */}
        <nav className="flex flex-wrap gap-1 glass rounded-2xl p-1">
          {TABS.map(([k, l]) => {
            const locked = k === "setup" ? false : k === "scan" ? !profile.configured : !unlocked;
            return <button key={k} onClick={() => goTab(k)} className={`px-3 py-2 text-sm rounded-xl transition ${tab === k ? "bg-cyan-500 text-slate-950 font-bold" : "hover:bg-white/10 text-slate-300"} ${locked ? "opacity-50" : ""} ${shake === k ? "shake" : ""}`}>{locked ? "🔒 " : ""}{l}</button>;
          })}
        </nav>

        {/* STAT STRIP */}
        {unlocked && tab !== "setup" && tab !== "history" && (
          <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-2">
            {[["Learners", data.total], ["Mean", fmt(data.mean)], ["MPS", fmt(data.mps) + "%"], ["Std. Dev.", fmt(data.sd)], ["Passed / Failed", `${data.passed} / ${data.total - data.passed}`], ["High / Low", `${data.high} / ${data.low}`]].map(([l, v]) =>
              <Card key={l} className="!p-3"><p className="text-[11px] text-slate-400">{l}</p><p className="text-lg font-black text-white">{v}</p></Card>)}
            <Card className="!p-3"><p className="text-[11px] text-slate-400 mb-1">Proficiency</p><Badge pct={data.mps} /></Card>
          </div>
        )}

        {/* ===== SETUP ===== */}
        {tab === "setup" && <>
          <Card>
            <h2 className="font-black text-white text-lg mb-3">🎯 Exam Configuration</h2>
            <div className="grid md:grid-cols-4 gap-3">
              <label><Label>Term</Label>
                <Select value={term} onChange={e => updateConfig({ term: e.target.value })}>
                  {["Term 1", "Term 2", "Term 3"].map(t => <option key={t}>{t}</option>)}</Select></label>
              <label><Label>Exam</Label>
                <Select value={slot} onChange={e => updateConfig({ slot: e.target.value })}>
                  <option value="ST1">Summative Test 1 (ST1)</option><option value="ST2">Summative Test 2 (ST2)</option><option value="TE">Term Exam (TE)</option></Select></label>
              <label><Label>Subject</Label>
                <Select value={config.subject} onChange={e => updateConfig({ subject: e.target.value })}>
                  {SUBJECTS.filter(s => config.examType === "term" || !s.termOnly).map(s => <option key={s.code} value={s.code}>{s.label}</option>)}</Select></label>
              <label><Label>Total Items</Label>
                <Input type="number" min="1" max="100" defaultValue={config.itemCount} key={config.itemCount}
                  onBlur={e => { const v = Math.max(1, Math.min(100, +e.target.value || 1)); if (v !== config.itemCount) updateConfig({ itemCount: v }, true); }}
                  onKeyDown={e => e.key === "Enter" && e.target.blur()} /></label>
            </div>
            {itemWarn && <p className="mt-3 text-xs rounded-lg border border-amber-400/40 bg-amber-400/10 text-amber-200 p-2">⚠ {itemWarn} You can still continue. (Grade is taken from Class Setup: {grade}.)</p>}
            <div className="grid md:grid-cols-2 gap-3 mt-3">
              <label><Label>Passing Mark (% correct)</Label>
                <Input type="number" min="1" max="100" value={passMark} onChange={e => { const v = Math.max(1, Math.min(100, +e.target.value || 1)); setPassMark(v); store.set("passMarkV2", v); }} />
                <span className="text-[11px] text-slate-500">DO 15, s. 2026 (SY 2026–2027 adjusted table): 70 = passing 75. From SY 2027–2028, 75 = 75.</span></label>
            </div>
          </Card>

          <Card>
            <div ref={keyRef} className="flex flex-wrap items-center justify-between gap-2 mb-3">
              <h2 className="font-black text-white text-lg">🔑 Answer Key ({n})</h2>
              <div className="flex items-center gap-2">
                {keySaved ? <span className="text-xs text-emerald-300">✔ Saved</span> : <span className="text-xs text-amber-300">Not saved yet</span>}
                <button onClick={saveKey} className="px-4 py-2 text-sm rounded-lg bg-emerald-500 text-slate-950 font-bold">Save Answer Key</button>
              </div>
            </div>
            {tags && (
              <div className="mb-3 bg-slate-900/50 rounded-xl p-3">

                <div className="grid sm:grid-cols-2 gap-2">
                  {subj.comps.map((c, ci) => {
                    const cnt = tags.filter(t => t === ci).length;
                    return (
                      <div key={c} className="flex items-center gap-2">
                        <span className={`${COMP_STYLE[ci]} text-white text-[11px] font-bold rounded px-2 py-1 w-24 text-center`}>{c} · {cnt}</span>
                        <Input value={quick[ci] || ""} placeholder={listItems(tags.map((t, i) => t === ci ? i + 1 : 0).filter(Boolean)) || "item numbers"} onChange={e => setQuick({ ...quick, [ci]: e.target.value })} onKeyDown={e => e.key === "Enter" && applyQuick(ci)} className="!py-1 text-xs font-mono" />
                        <button onClick={() => applyQuick(ci)} className="px-2 py-1 text-xs rounded bg-white/10">Set</button>

                <button onClick={() => { setTags(defaultTags(n, subj.comps)); setQuick({}); }} className="mt-2 text-[11px] text-slate-400 underline">Reset to blocks</button>

                </div>))}
            </div>
            <p className="text-[11px] text-slate-500 mt-2">Tip: you can also shade a sheet as KEY and scan it. The key fills in by itself.</p>
